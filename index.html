// ---------- PROFILES ----------
// Two profiles share the same password and Cloudflare backend; data is fully
// partitioned by profile id (separate localStorage buckets, ?profile= on every API call).
const PROFILES = [
  { id: 'vad',   name: 'Vad',   gradient: 'from-orange-500 to-red-500',     glow: 'shadow-orange-900/30' },
  { id: 'tatka', name: 'Tatka', gradient: 'from-pink-500 to-rose-500',      glow: 'shadow-rose-900/30'   },
];
const PROFILE_KEY = 'vt_active_profile_v1';
const getActiveProfile = () => {
  const stored = localStorage.getItem(PROFILE_KEY);
  if (stored && PROFILES.some(p => p.id === stored)) return stored;
  return null;  // not yet picked → show profile picker after login
};
const setActiveProfile = (id) => localStorage.setItem(PROFILE_KEY, id);
const clearActiveProfile = () => localStorage.removeItem(PROFILE_KEY);
const profileMeta = (id) => PROFILES.find(p => p.id === id) || PROFILES[0];

// ---------- AUTH ----------
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const SESSION_KEY = 'vt_session_v1';
const HASH_KEY = 'vt_pwhash_v1';
const getStoredHash = () => PASSWORD_SHA256 || localStorage.getItem(HASH_KEY) || '';
const setStoredHash = (h) => localStorage.setItem(HASH_KEY, h);
const isLoggedIn = () => {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const { ts } = JSON.parse(raw);
    return Date.now() - ts < SESSION_DAYS * 24 * 60 * 60 * 1000;
  } catch { return false; }
};
const startSession = () => localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
const endSession = () => localStorage.removeItem(SESSION_KEY);

// ---------- CLOUD API ----------
// Paste your bearer token here to enable cross-device sync via Cloudflare D1.
// Leave both blank to fall back to pure localStorage mode (works offline / from disk).
const API_BASE  = 'https://rodiucov.com';
const API_TOKEN = '54cdb3d799ee3cb3bc7601b894b0e90e395f9e6894bd8d3afbec92ac719609d6';   // <-- paste your 64-char API_TOKEN here
const cloudEnabled = () => !!(API_BASE && API_TOKEN);

async function apiFetch(path, opts = {}, profile = null) {
  // Append ?profile=<id> (or &profile=) to every authed call so server scopes
  // reads/writes correctly. /api/health doesn't care, but the harmless extra
  // query string doesn't break it either.
  let url = API_BASE + path;
  if (profile) {
    const sep = url.includes('?') ? '&' : '?';
    url = url + sep + 'profile=' + encodeURIComponent(profile);
  }
  const r = await fetch(url, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${API_TOKEN}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text().catch(()=>'');
    throw new Error(`API ${r.status}: ${txt || r.statusText}`);
  }
  if (r.status === 204) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('application/json') ? r.json() : r.text();
}

// Build a cloud client bound to a specific profile. We re-create this when the
// active profile changes so every call is automatically scoped.
const cloudFor = (profile) => ({
  health:           () => apiFetch('/api/health'),
  snapshot:         () => apiFetch('/api/snapshot', {}, profile),
  putProgramme:     (week, days) => apiFetch('/api/programme', { method:'PUT', body: JSON.stringify({ week, days }) }, profile),
  deleteProgramme:  (week) => apiFetch(`/api/programme?week=${encodeURIComponent(week)}`, { method:'DELETE' }, profile),
  addResult:        (r) => apiFetch('/api/results', { method:'POST', body: JSON.stringify(r) }, profile),
  deleteResult:     (id) => apiFetch(`/api/results/${encodeURIComponent(id)}`, { method:'DELETE' }, profile),
  putGenerator:     (g) => apiFetch('/api/generator', { method:'PUT', body: JSON.stringify(g) }, profile),
  migrate:          (payload) => apiFetch('/api/migrate', { method:'POST', body: JSON.stringify(payload) }, profile),
});

// Merge local and server results: union by id, server wins on dup, sort newest first.
function mergeResults(localArr, serverArr) {
  const byId = new Map();
  for (const r of (localArr || [])) byId.set(r.id, { ...r, _origin: 'local' });
  for (const r of (serverArr || [])) byId.set(r.id, { ...r, _origin: 'server' });
  const merged = [...byId.values()]
    .map(({ _origin, ...rest }) => rest)
    .sort((a,b) => new Date(b.date).getTime() - new Date(a.date).getTime());
  const localIds  = new Set((localArr  || []).map(r => r.id));
  const serverIds = new Set((serverArr || []).map(r => r.id));
  const localOnly = (localArr || []).filter(r => !serverIds.has(r.id));
  return { merged, localOnly };
}

// ---------- DATA ----------
// Per-profile localStorage bucket. Old single-profile key migrates into the
// 'vad' bucket on first read so existing data is preserved.
const KEY_LEGACY = 'vad-training-v1';
const dataKey = (profile) => `vad-training-v1-${profile}`;
const SOUND_KEY = 'vt_sound_v1';
const getSound = () => { try { return localStorage.getItem(SOUND_KEY) !== '0'; } catch { return true; } };
const setSoundPref = (on) => { try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch {} };
const seedData = () => ({

  results: [],

    perWeek: 3, weeks: 4, startWeek: 1,
    focus: 'General Fitness', intensity: 'Moderate',
  },

});
const loadData = (profile) => {
  try {
    const k = dataKey(profile);
    let raw = localStorage.getItem(k);
    // First-time read for the 'vad' profile: pull from the legacy single-bucket
    // key (and from the even-older crossfit-ai-data-v2) if present. We do NOT

    if (!raw && profile === 'vad') {

         || localStorage.getItem('crossfit-ai-data-v2')
         || null;
      if (raw) localStorage.setItem(k, raw);
    }
    if (!raw) return seedData();
    return { ...seedData(), ...JSON.parse(raw) };

};

// ---------- AUDIO + WAKE LOCK ----------
function useAudio(muted) {
  const ctxRef = useRef(null);
  const ensureCtx = async () => {
    // Lazily create AudioContext on first call. iOS requires this to be on a user gesture,
    // which is satisfied because every entry point (start, mode switch, tap-counter) is one.
    if (!ctxRef.current) {
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { return null; }
    }
    const ctx = ctxRef.current;
    // iOS leaves the context in 'suspended' or 'interrupted' state after sleep/background.
    // resume() returns a promise; if we don't await it, the first beep after sleep is silent.
    if (ctx.state !== 'running') {
      try { await ctx.resume(); } catch {}
    }
    // If resume failed (Safari sometimes wedges the context), throw it away and try once more.
    if (ctx.state !== 'running') {
      try { ctx.close(); } catch {}
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { ctxRef.current = null; return null; }
      try { await ctxRef.current.resume(); } catch {}
    }
    return ctxRef.current && ctxRef.current.state === 'running' ? ctxRef.current : null;
  };
  const beep = async (freq, dur, vol=0.3) => {
    if (muted) return;
    const ctx = await ensureCtx(); if (!ctx) return;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
    osc.start(); osc.stop(ctx.currentTime + dur/1000);
  };
  return {
    tick: () => beep(820, 70, 0.18), tickWarn: () => beep(880, 110, 0.28),
    go: () => beep(1100, 260, 0.38), rest: () => beep(480, 220, 0.28),
    sideSwitch: () => beep(950, 140, 0.28),
    done: async () => { await beep(820,130,0.3); setTimeout(()=>beep(1050,130,0.3),160); setTimeout(()=>beep(1350,280,0.34),320); },
    unlock: () => beep(600, 10, 0.001),
  };
}
function useWakeLock(active) {
  useEffect(() => {
    let lock = null;
    if (active && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(l=>{lock=l;}).catch(()=>{});
    return () => { if (lock) lock.release().catch(()=>{}); };
  }, [active]);
}
function useHaptic() {
  return (pattern = 10) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {} };
}
function useOrientation() {
  const get = () => (typeof window !== 'undefined' && window.matchMedia('(orientation: landscape)').matches && window.innerHeight < 600);
  const [land, setLand] = useState(get);
  useEffect(() => {
    const onChange = () => setLand(get());
    window.addEventListener('resize', onChange);
    window.addEventListener('orientationchange', onChange);
    return () => {
      window.removeEventListener('resize', onChange);
      window.removeEventListener('orientationchange', onChange);
    };
  }, []);
  return land;
}
const fmt = (sec) => {
  const s = Math.max(0, sec);
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
};

// ---------- LOGIN ----------
function LoginScreen({ onSuccess }) {
  const [pw, setPw] = useState('');
  const [confirm, setConfirm] = useState('');
  const [show, setShow] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const stored = getStoredHash();
  const isSetup = !stored;
  const haptic = useHaptic();

  const submit = async () => {
    setError(''); setBusy(true);
    try {
      if (isSetup) {
        if (pw.length < 6) { setError('Password must be at least 6 characters'); setBusy(false); haptic([20,40,20]); return; }
        if (pw !== confirm) { setError('Passwords do not match'); setBusy(false); haptic([20,40,20]); return; }
        const h = await sha256(pw);
        setStoredHash(h); startSession(); haptic(15); onSuccess();
      } else {
        const h = await sha256(pw);
        if (h !== stored) { setError('Wrong password'); setBusy(false); haptic([20,40,20]); return; }
        startSession(); haptic(15); onSuccess();
      }
    } catch (e) { setError('Crypto failed: '+e.message); }
    setBusy(false);
  };
  const onKey = (e) => { if (e.key === 'Enter') submit(); };

  return (
    <div className="min-h-screen bg-stone-950 flex items-center justify-center p-6 pt-safe pb-safe">
      <div className="w-full max-w-sm">
        <div className="text-center mb-10">
          <div className="inline-flex items-center justify-center w-20 h-20 rounded-3xl gradient-orange mb-6 shadow-2xl shadow-orange-900/40">
            <Icons.Lock size={32}/>
          </div>
          <h1 className="gradient-text font-extrabold text-4xl tracking-tight">Vad Training</h1>
          <p className="text-stone-500 text-sm mt-3">{isSetup ? 'First-time setup — create a password' : 'Enter your password'}</p>
        </div>
        <div className="space-y-3">
          <div className="relative">
            <input type={show ? 'text' : 'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={onKey}
              placeholder="Password" autoFocus
              autoComplete={isSetup ? 'new-password' : 'current-password'}
              className="w-full bg-stone-900 border border-stone-800 rounded-2xl px-5 py-5 pr-14 text-stone-100 focus:outline-none focus:border-orange-500"/>
            <button onClick={()=>setShow(s=>!s)} className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-500 p-2 tap-scale">
              {show ? <Icons.EyeOff size={20}/> : <Icons.Eye size={20}/>}
            </button>
          </div>
          {isSetup && (
            <input type={show ? 'text' : 'password'} value={confirm} onChange={e=>setConfirm(e.target.value)} onKeyDown={onKey}
              placeholder="Confirm password" autoComplete="new-password"
              className="w-full bg-stone-900 border border-stone-800 rounded-2xl px-5 py-5 text-stone-100 focus:outline-none focus:border-orange-500"/>
          )}
          {error && <div className="text-red-400 text-sm px-2 text-center">{error}</div>}
          <button onClick={submit} disabled={busy || !pw}
            className="w-full gradient-orange text-white font-bold uppercase tracking-[0.15em] py-5 rounded-2xl disabled:opacity-50 tap-scale shadow-lg shadow-orange-900/30">
            {busy ? '…' : isSetup ? 'Create password' : 'Unlock'}
          </button>
          {isSetup && (
            <p className="text-[11px] text-stone-600 text-center px-3 mt-4 leading-relaxed">
              Saved to this device. To use the same password on another device, open Settings → Lock to file after login.
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

  const [newPw, setNewPw] = useState('');

  const [hashOut, setHashOut] = useState('');
  const [copied, setCopied] = useState(false);
  const [soundOn, setSoundOnLocal] = useState(getSound);
  const toggleSound = () => { const next = !soundOn; setSoundOnLocal(next); setSoundPref(next); };
  const meta = profileMeta(profile);

  const change = async () => {
    setMsg('');
    const stored = getStoredHash();
    const oh = await sha256(oldPw);
    if (oh !== stored) { setMsg('Old password is wrong'); return; }
    if (newPw.length < 6) { setMsg('New password must be at least 6 characters'); return; }
    if (newPw !== newConfirm) { setMsg('New passwords do not match'); return; }
    const nh = await sha256(newPw);
    setStoredHash(nh);
    setMsg('Password changed.');
    setHashOut(nh); setView('lock');
    setOldPw(''); setNewPw(''); setNewConfirm('');
  };
  const showCurrentHash = () => {
    const h = getStoredHash();
    if (!h) { setMsg('No password set yet'); return; }
    setHashOut(h); setView('lock');
  };
  const copyHash = () => {
    navigator.clipboard.writeText(hashOut).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false), 2000); });
  };
  const exportData = () => {
    const data = localStorage.getItem(dataKey(profile)) || '{}';
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `vad-training-${profile}-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

    if (!confirm(`Switch profile? You're currently signed into ${meta.name}. You'll be returned to the profile picker.`)) return;
    onClose();
    setTimeout(onSwitchProfile, 50);

                  <div>

                    <div className="text-xs text-stone-500 mt-0.5">Tap to switch</div>
                  </div>

                <Icons.LogOut size={18} className="text-stone-500"/>

              <input type="password" value={oldPw} onChange={e=>setOldPw(e.target.value)} placeholder="Current password" autoComplete="current-password" className="w-full bg-stone-900 border border-stone-800 rounded-2xl px-4 py-4 text-stone-100 focus:outline-none focus:border-orange-500"/>

// ---------- CHRONO TIMER (mobile-optimized) ----------
const PRESTART_SEC = 10;

function ChronoTimer({ initialMode='rest', initialConfig={}, onClose, onLog }) {
  const [mode, setMode] = useState(initialMode);
  const [soundOn, setSoundOnState] = useState(getSound);
  const setSoundOn = (v) => { setSoundOnState(v); setSoundPref(v); };
  const audio = useAudio(!soundOn);
  const haptic = useHaptic();
  const landscape = useOrientation();

  const [restSec, setRestSec] = useState(initialConfig.restSec ?? 150);
  const [restSets, setRestSets] = useState(initialConfig.restSets ?? 4);
  const [amrapMin, setAmrapMin] = useState(initialConfig.amrapMin ?? 20);
  const [forTimeCapMin, setForTimeCapMin] = useState(initialConfig.capMin ?? 15);
  const [emomRounds, setEmomRounds] = useState(initialConfig.emomRounds ?? 12);
  const [intWork, setIntWork] = useState(initialConfig.intWork ?? 180);
  const [intRest, setIntRest] = useState(initialConfig.intRest ?? 90);
  const [intRounds, setIntRounds] = useState(initialConfig.intRounds ?? 6);
  const [holdSec, setHoldSec] = useState(initialConfig.holdSec ?? 20);
  const [holdSides, setHoldSides] = useState(initialConfig.holdSides ?? 2);
  const [holdRounds, setHoldRounds] = useState(initialConfig.holdRounds ?? 3);

  const [phase, setPhase] = useState('idle');
  const [elapsed, setElapsed] = useState(0);
  const [setIdx, setSetIdx] = useState(1);
  const [rounds, setRounds] = useState(0);
  const [intervalIdx, setIntervalIdx] = useState(1);
  const [isWork, setIsWork] = useState(true);
  const [sideIdx, setSideIdx] = useState(1);
  const [holdRoundIdx, setHoldRoundIdx] = useState(1);
  // For STRENGTH/rest mode: 'set' = stopwatch counting up during the lift,
  // 'rest' = countdown after user taps DONE
  const [restPhase, setRestPhase] = useState('set');

  const startRef = useRef(null), pausedElapsedRef = useRef(0), lastBeepSec = useRef(-1);
  useWakeLock(phase === 'running' || phase === 'prestart');
  useEffect(() => { fullReset(); }, [mode]);

  function fullReset() {
    setPhase('idle'); setElapsed(0); setSetIdx(1); setRounds(0);
    setIntervalIdx(1); setIsWork(true); setSideIdx(1); setHoldRoundIdx(1);
    setRestPhase('set');
    startRef.current = null; pausedElapsedRef.current = 0; lastBeepSec.current = -1;
  }
  function timerOnlyReset() {
    setPhase('idle'); setElapsed(0); setRestPhase('set');
    startRef.current = null; pausedElapsedRef.current = 0; lastBeepSec.current = -1;
  }

  useEffect(() => {
    if (phase !== 'running' && phase !== 'prestart') return;
    if (!startRef.current) startRef.current = Date.now() - pausedElapsedRef.current * 1000;
    const id = setInterval(() => setElapsed((Date.now() - startRef.current)/1000), 80);
    return () => clearInterval(id);
  }, [phase]);

  useEffect(() => {
    if (phase === 'prestart') {
      const rem = PRESTART_SEC - elapsed;
      if (rem <= 3 && rem > 0) {
        const s = Math.ceil(rem);
        if (lastBeepSec.current !== s) { lastBeepSec.current = s; audio.tickWarn(); haptic(15); }
      }
      if (rem <= 0) {
        audio.go(); haptic([30,30,30]);
        startRef.current = Date.now(); pausedElapsedRef.current = 0;
        lastBeepSec.current = -1; setElapsed(0); setPhase('running');
      }
      return;
    }
    if (phase !== 'running') return;
    const cb = (rem) => { if (rem <= 3 && rem > 0) { const s = Math.ceil(rem); if (lastBeepSec.current !== s) { lastBeepSec.current = s; audio.tick(); haptic(10); } } };
    if (mode === 'rest') {
      if (restPhase === 'set') {
        // stopwatch — no auto-finish; user taps DONE to switch to rest countdown
      } else {
        const rem = restSec - elapsed;
        cb(rem);
        if (rem <= 0) {
          audio.go(); haptic([20,30,20]);
          if (setIdx < restSets) {
            // Auto-advance straight to next set's working stopwatch — no prestart, no "Next set" tap
            setSetIdx(s => s + 1);
            setRestPhase('set');
            startRef.current = Date.now();
            pausedElapsedRef.current = 0;
            lastBeepSec.current = -1;
            setElapsed(0);
            // phase stays 'running'
          } else {
            // Last rest finished — workout done
            setPhase('done');
          }
        }
      }
    }
    else if (mode === 'amrap') { const rem = amrapMin*60 - elapsed; cb(rem); if (rem <= 0) { audio.done(); haptic([30,30,30,30,30]); setPhase('done'); } }
    else if (mode === 'fortime') { const rem = forTimeCapMin*60 - elapsed; cb(rem); if (rem <= 0) { audio.done(); haptic([30,30,30,30,30]); setPhase('done'); } }
    else if (mode === 'emom') {
      const mi = Math.floor(elapsed/60), ex = mi+1;
      if (mi >= emomRounds) { audio.done(); haptic([30,30,30,30,30]); setPhase('done'); return; }
      if (ex > intervalIdx) { setIntervalIdx(ex); audio.go(); haptic(20); }
    }
    else if (mode === 'intervals') {
      const cycle = intWork+intRest;
      const completed = Math.floor(elapsed/cycle), inCycle = elapsed - completed*cycle;
      const nowWork = inCycle < intWork, ci = completed+1;
      if (ci > intRounds) { audio.done(); haptic([30,30,30,30,30]); setPhase('done'); return; }
      if (ci !== intervalIdx) setIntervalIdx(ci);
      if (nowWork !== isWork) { setIsWork(nowWork); nowWork ? audio.go() : audio.rest(); haptic(15); }
      cb(nowWork ? (intWork-inCycle) : (cycle-inCycle));
    }
    else if (mode === 'hold') {
      const rem = holdSec - elapsed; cb(rem);
      if (rem <= 0) {
        if (sideIdx < holdSides) { audio.sideSwitch(); haptic(15); setSideIdx(s=>s+1); startRef.current=Date.now(); pausedElapsedRef.current=0; lastBeepSec.current=-1; setElapsed(0); }
        else if (holdRoundIdx < holdRounds) { audio.sideSwitch(); haptic(15); setSideIdx(1); setHoldRoundIdx(r=>r+1); startRef.current=Date.now(); pausedElapsedRef.current=0; lastBeepSec.current=-1; setElapsed(0); }
        else { audio.done(); haptic([30,30,30,30,30]); setPhase('done'); }
      }
    }
  }, [elapsed, phase, mode]);

  const start = () => {
    audio.unlock(); haptic(15);
    if (phase === 'idle' || phase === 'done') {
      if (phase === 'done') { setElapsed(0); pausedElapsedRef.current = 0; lastBeepSec.current = -1; }
      startRef.current = Date.now(); pausedElapsedRef.current = 0; lastBeepSec.current = -1;
      setElapsed(0); setPhase('prestart');
    } else if (phase === 'paused') setPhase('running');
  };
  const skipPrestart = () => {
    if (phase !== 'prestart') return;
    haptic(20);
    audio.go(); startRef.current = Date.now(); pausedElapsedRef.current = 0;
    lastBeepSec.current = -1; setElapsed(0); setPhase('running');
  };
  const pause = () => { if (phase === 'running') { haptic(10); pausedElapsedRef.current = elapsed; startRef.current = null; setPhase('paused'); } };
  const nextSet = () => { if (setIdx < restSets) { setSetIdx(s=>s+1); setRestPhase('set'); timerOnlyReset(); } else fullReset(); };
  // Strength flow: tap DONE after a set → instantly switch to rest countdown without confirmation
  const setDone = () => {
    if (mode !== 'rest' || phase !== 'running' || restPhase !== 'set') return;
    haptic([10,20,10]); audio.rest();
    setRestPhase('rest');
    startRef.current = Date.now(); pausedElapsedRef.current = 0; lastBeepSec.current = -1;
    setElapsed(0);
  };

  let big = '00:00', phaseLbl = 'READY', context = '', accent = 'text-stone-100';
  if (mode === 'rest')      {
    if (restPhase === 'set' && phase === 'running') {
      big = fmt(elapsed);
      phaseLbl = 'WORKING';
      context = `SET ${setIdx} of ${restSets}`;
      accent='text-lime-400';
    } else if (restPhase === 'rest' && phase === 'running') {
      const r = Math.max(0, restSec - elapsed);
      big = fmt(r);
      phaseLbl = 'RESTING';
      context = `SET ${setIdx} of ${restSets}`;
      accent = r<=10 ? 'text-amber-400' : 'text-sky-400';
    } else if (phase === 'done') {
      big = fmt(0);
      phaseLbl = 'GO';
      context = `SET ${setIdx} of ${restSets}`;
      accent='text-lime-400';
    } else {
      big = fmt(0);
      phaseLbl = 'READY';
      context = `SET ${setIdx} of ${restSets}`;
    }
  }
  else if (mode === 'amrap')    { const r = Math.max(0, amrapMin*60 - elapsed); big = fmt(phase==='done'?0:r); phaseLbl = phase==='done'?'TIME':phase==='running'?'WORK':'READY'; context = `ROUNDS · ${rounds}`; if (phase==='running') accent='text-lime-400'; if (phase==='done') accent='text-red-500'; }
  else if (mode === 'fortime')  { big = fmt(elapsed); phaseLbl = phase==='done'?'DONE':phase==='running'?'WORK':'READY'; context = `CAP ${fmt(forTimeCapMin*60)}`; if (phase==='running') accent='text-lime-400'; }
  else if (mode === 'emom')     { const mr = 60 - (elapsed%60); big = fmt(phase==='running'?mr:60); phaseLbl = phase==='done'?'DONE':phase==='running'?'WORK':'READY'; context = `MIN ${intervalIdx} of ${emomRounds}`; if (phase==='running') accent='text-lime-400'; }
  else if (mode === 'intervals'){ const cycle = intWork+intRest; const ic = elapsed - Math.floor(elapsed/cycle)*cycle; const pr = isWork?(intWork-ic):(cycle-ic); big = fmt(phase==='running'?Math.max(0,pr):intWork); phaseLbl = phase==='done'?'DONE':phase==='running'?(isWork?'WORK':'REST'):'READY'; context = `REP ${intervalIdx} of ${intRounds}`; if (phase==='running') accent = isWork?'text-lime-400':'text-sky-400'; }
  else if (mode === 'hold')     { const r = Math.max(0, holdSec-elapsed); big = fmt(phase==='done'?0:r); phaseLbl = phase==='done'?'DONE':phase==='running'?(holdSides>1?(sideIdx===1?'LEFT':'RIGHT'):'HOLD'):'READY'; context = `ROUND ${holdRoundIdx} of ${holdRounds}`; if (phase==='running') accent='text-lime-400'; }
  else if (mode === 'stopwatch'){ big = fmt(elapsed); phaseLbl = phase==='running'?'RUNNING':phase==='paused'?'PAUSED':'READY'; if (phase==='running') accent='text-lime-400'; }
  if (phase === 'prestart') { const r = Math.max(0, PRESTART_SEC-elapsed); big = String(Math.ceil(r)).padStart(2,'0'); phaseLbl='GET READY'; context='STARTING IN...'; accent='text-amber-400'; }

  const Step = ({label, value, set, min=0, max=999, step=1, suffix}) => (
    <div className="flex flex-col gap-1.5">
      <div className="text-[10px] uppercase tracking-[0.18em] text-stone-500 font-semibold">{label}</div>
      <div className="flex items-center bg-stone-900 rounded-xl border border-stone-800 h-12">
        <button onClick={()=>{set(Math.max(min,value-step)); haptic(5);}} className="px-3 h-full text-stone-400 tap-scale flex items-center justify-center min-w-[44px]"><Icons.Minus size={16}/></button>
        <div className="flex-1 text-center font-digits tabular-nums text-stone-100 text-base font-bold">{value}{suffix && <span className="text-stone-500 text-xs ml-0.5">{suffix}</span>}</div>
        <button onClick={()=>{set(Math.min(max,value+step)); haptic(5);}} className="px-3 h-full text-stone-400 tap-scale flex items-center justify-center min-w-[44px]"><Icons.Plus size={16}/></button>
      </div>
    </div>
  );
  const renderConfig = () => {
    if (phase === 'running' || phase === 'prestart') return null;
    const w = "grid grid-cols-3 gap-2 px-4 py-4";
    if (mode === 'rest') return <div className={w}><Step label="Rest" value={restSec} set={setRestSec} min={5} step={5} suffix="s"/><Step label="Sets" value={restSets} set={setRestSets} min={1} max={20}/><Step label="Set #" value={setIdx} set={setSetIdx} min={1} max={restSets}/></div>;
    if (mode === 'amrap') return <div className={w}><Step label="Minutes" value={amrapMin} set={setAmrapMin} min={1} max={60} suffix="m"/></div>;
    if (mode === 'fortime') return <div className={w}><Step label="Cap" value={forTimeCapMin} set={setForTimeCapMin} min={1} max={60} suffix="m"/></div>;
    if (mode === 'emom') return <div className={w}><Step label="Rounds" value={emomRounds} set={setEmomRounds} min={1} max={60}/></div>;
    if (mode === 'intervals') return <div className={w}><Step label="Work" value={intWork} set={setIntWork} min={5} step={5} suffix="s"/><Step label="Rest" value={intRest} set={setIntRest} min={5} step={5} suffix="s"/><Step label="Reps" value={intRounds} set={setIntRounds} min={1} max={30}/></div>;
    if (mode === 'hold') return <div className={w}><Step label="Duration" value={holdSec} set={setHoldSec} min={5} step={5} suffix="s"/><Step label="Sides" value={holdSides} set={setHoldSides} min={1} max={2}/><Step label="Rounds" value={holdRounds} set={setHoldRounds} min={1} max={10}/></div>;
    return null;
  };

  const onRoundTap = () => { if (phase==='running' && mode==='amrap') { setRounds(r=>r+1); audio.tick(); haptic(15); } };
  const progressPct = () => {
    if (phase === 'prestart') return Math.min(100, (elapsed/PRESTART_SEC)*100);
    if (mode==='rest')     return restPhase==='rest' ? Math.min(100, (elapsed/restSec)*100) : 0;
    if (mode==='amrap')    return Math.min(100, (elapsed/(amrapMin*60))*100);
    if (mode==='fortime')  return Math.min(100, (elapsed/(forTimeCapMin*60))*100);
    if (mode==='emom')     return Math.min(100, (elapsed/(emomRounds*60))*100);
    if (mode==='intervals'){ const t = intRounds*(intWork+intRest); return Math.min(100,(elapsed/t)*100); }
    if (mode==='hold')     { const pr = holdSec*holdSides; const ir = (sideIdx-1)*holdSec+elapsed; return Math.min(100, (((holdRoundIdx-1)*pr+ir)/(holdRounds*pr))*100); }
    return 0;
  };

  const handleLog = (closeAfter = true) => {
    if (!onLog) { onClose(); return; }
    let result = { mode };
    if (mode === 'amrap')    result = { mode, rounds, timeSec: Math.floor(elapsed) };
    else if (mode === 'fortime') result = { mode, timeSec: Math.floor(elapsed), capped: phase==='done' && elapsed >= forTimeCapMin*60 };
    else if (mode === 'rest')    result = { mode, setsCompleted: phase==='done' ? setIdx : Math.max(0, setIdx - (restPhase==='set'?1:0)) };
    else if (mode === 'intervals') result = { mode, repsCompleted: intervalIdx };
    else                       result = { mode, timeSec: Math.floor(elapsed) };
    haptic([10,30,10]);
    onLog(result, closeAfter);
  };

  const MODES = [
    { id:'rest', label:'REST'}, { id:'amrap', label:'AMRAP'}, { id:'fortime', label:'FOR TIME'},
    { id:'emom', label:'EMOM'}, { id:'intervals', label:'INTERVALS'}, { id:'hold', label:'HOLD'}, { id:'stopwatch', label:'STOPWATCH'},
  ];

  return (
    <div className="fixed inset-0 z-50 bg-stone-950 flex flex-col sheet-slide pt-safe pb-safe">
      <header className="flex items-start justify-between px-4 pt-3 pb-3 border-b border-stone-900 gap-3">
        <div className="flex flex-col min-w-0 flex-1 gap-0.5">
          <span className="font-digits font-extrabold text-base tracking-tight">CHRONO</span>
          {initialConfig.workoutName && (
            <span className="text-stone-300 text-xs leading-snug font-semibold break-words">{initialConfig.workoutName}</span>
          )}
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={onClose} className="p-2.5 rounded-full text-stone-400 tap-scale"><Icons.X size={20}/></button>
        </div>
      </header>
      <div className="flex overflow-x-auto gap-1.5 px-3 py-2.5 border-b border-stone-900 scrollbar-hide">
        {MODES.map(m=>(
          <button key={m.id} onClick={()=>{setMode(m.id); haptic(8);}}
            className={`px-3.5 py-2 rounded-full text-[11px] font-bold uppercase tracking-[0.14em] whitespace-nowrap transition border tap-scale ${mode===m.id?'bg-stone-100 text-stone-950 border-stone-100':'border-stone-800 text-stone-500'}`}>
            {m.label}
          </button>
        ))}
      </div>
      {renderConfig()}
      <div className="h-[2px] bg-stone-900 relative overflow-hidden">
        <div className={`absolute inset-y-0 left-0 ${phase==='prestart'?'bg-amber-500':'bg-red-600'} transition-all duration-75`} style={{width:`${progressPct()}%`}}/>
      </div>
      <div className={`flex-1 flex ${landscape ? 'flex-row' : 'flex-col'} min-h-0`}>
        <div onClick={onRoundTap} className={`flex-1 flex flex-col items-center justify-center px-5 ${landscape ? 'py-3' : 'py-6'} ${mode==='amrap'&&phase==='running'?'cursor-pointer active:bg-stone-900/50':''}`}>
          <div className={landscape ? 'mb-2' : 'mb-5'}>
            <span className={`inline-block px-3.5 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-[0.25em] border ${
              phase==='prestart'?'border-amber-600 text-amber-400 bg-amber-950/30 animate-pulse':
              phase==='done'?'border-red-600 text-red-500 bg-red-950/30':
              phase==='running'?'border-stone-700 text-stone-300 bg-stone-900/50':
              'border-stone-800 text-stone-500'}`}>● {phaseLbl}</span>
          </div>
          <div className={`font-digits font-extrabold leading-none ${landscape ? 'text-[4.5rem]' : 'text-[5.5rem] sm:text-8xl'} ${accent}`}>{big}</div>
          {mode==='amrap' && phase!=='prestart' && (
            <div className={`${landscape ? 'mt-3' : 'mt-8'} flex flex-col items-center gap-2`}>
              <div className="text-[10px] uppercase tracking-[0.25em] text-stone-500 font-bold">Rounds · tap screen</div>
              <div className="flex items-center gap-3">
                <button onClick={(e)=>{e.stopPropagation(); setRounds(r=>Math.max(0,r-1)); haptic(5);}} className="w-12 h-12 rounded-full bg-stone-900 border border-stone-800 text-stone-400 flex items-center justify-center tap-scale"><Icons.Minus size={18}/></button>
                <div className={`font-digits font-bold tabular-nums w-24 text-center ${landscape ? 'text-3xl' : 'text-5xl'}`}>{rounds}</div>
                <button onClick={(e)=>{e.stopPropagation(); setRounds(r=>r+1); audio.tick(); haptic(10);}} className="w-12 h-12 rounded-full bg-stone-900 border border-stone-800 text-stone-400 flex items-center justify-center tap-scale"><Icons.Plus size={18}/></button>
              </div>
            </div>
          )}
          {context && (mode!=='amrap' || phase==='prestart') && (
            <div className={`${landscape ? 'mt-3' : 'mt-6'} text-xs uppercase tracking-[0.28em] font-bold ${phase==='prestart'?'text-amber-500/70':'text-stone-500'}`}>{context}</div>
          )}
        </div>
        <div className={`${landscape ? 'border-l w-[42%] max-w-xs flex flex-col justify-center' : 'border-t'} border-stone-900 bg-stone-950 px-4 ${landscape ? 'py-3' : 'pt-4 pb-5'}`}>
          <div className={`flex ${landscape ? 'flex-col' : 'items-stretch'} gap-2`}>
            {phase==='prestart' ? (
              <button onClick={skipPrestart} className={`${landscape ? 'w-full' : 'flex-1'} bg-amber-500 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm h-14 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Skip size={20}/> Skip · {Math.ceil(Math.max(0, PRESTART_SEC-elapsed))}</button>
            ) : phase==='running' ? (
              <button onClick={pause} className={`${landscape ? 'w-full' : 'flex-1'} bg-stone-100 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm h-14 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Pause size={20}/> Pause</button>
            ) : phase==='done' && mode==='rest' && setIdx<restSets ? (
              <button onClick={()=>{nextSet(); setTimeout(start,50);}} className={`${landscape ? 'w-full' : 'flex-1'} bg-red-600 text-white font-bold uppercase tracking-[0.2em] text-sm h-14 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Skip size={20}/> Next set ({setIdx+1}/{restSets})</button>
            ) : (
              <button onClick={start} className={`${landscape ? 'w-full' : 'flex-1'} gradient-orange text-white font-bold uppercase tracking-[0.2em] text-sm h-14 rounded-2xl flex items-center justify-center gap-2 tap-scale shadow-lg shadow-orange-900/30`}><Icons.Play size={20}/>{phase==='paused'?'Resume':phase==='done'?'Again':'Start'}</button>
            )}
            <button onClick={fullReset} className={`${landscape ? 'w-full h-12' : 'w-14 h-14'} bg-stone-900 border border-stone-800 text-stone-400 rounded-2xl flex items-center justify-center tap-scale`}><Icons.Reset size={20}/></button>
          </div>
          {/* DONE button — strength flow: appears during the SET phase, instantly switches to rest countdown */}
          {mode==='rest' && phase==='running' && restPhase==='set' && (
            <button onClick={setDone} className={`mt-2 w-full bg-lime-500 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm h-12 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Check size={18}/> Done · start rest</button>
          )}
          {/* Manual finish — for_time mode keeps its own bespoke button */}
          {mode==='fortime' && phase==='running' && (
            <button onClick={()=>{audio.done(); haptic([30,30,30,30,30]); setPhase('done');}} className={`mt-2 w-full bg-lime-500 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm h-12 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Check size={18}/> Finish</button>
          )}
          {/* Log & close mid-workout — available while running on any logging mode (not for_time which has its own Finish) */}
          {phase==='running' && onLog && mode!=='fortime' && (
            <button onClick={()=>handleLog(true)} className={`mt-2 w-full bg-stone-800 border border-stone-700 text-stone-100 font-bold uppercase tracking-[0.2em] text-sm h-12 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Save size={18}/> Log &amp; close</button>
          )}
          {/* End-of-timer log button (existing flow) */}
          {phase==='done' && onLog && (
            <button onClick={()=>handleLog(true)} className={`mt-2 w-full gradient-orange text-white font-bold uppercase tracking-[0.2em] text-sm h-12 rounded-2xl flex items-center justify-center gap-2 tap-scale`}><Icons.Save size={18}/> Log result &amp; close</button>
          )}
        </div>
      </div>
    </div>
  );
}

const blockToTimer = (block) => {
  const c = block.config || {};
  switch (block.type) {
    case 'AMRAP': return { mode: 'amrap', config: { amrapMin: c.minutes ?? 20 } };
    case 'FOR_TIME': return { mode: 'fortime', config: { capMin: c.capMinutes ?? 15 } };
    case 'EMOM': return { mode: 'emom', config: { emomRounds: c.rounds ?? 12 } };
    case 'INTERVALS': return { mode: 'intervals', config: { intWork: c.workSec ?? 60, intRest: c.restSec ?? 60, intRounds: c.rounds ?? 6 } };
    case 'HOLD': return { mode: 'hold', config: { holdSec: c.seconds ?? 30, holdSides: c.sides ?? 1, holdRounds: c.rounds ?? 3 } };
    case 'STRENGTH': return { mode: 'rest', config: { restSec: c.restSec ?? 150, restSets: c.sets ?? 4 } };
    case 'WARMUP': return { mode: 'stopwatch', config: {} };
    default: return { mode: 'stopwatch', config: {} };
  }
};

const BLOCK_STYLE = {
  WARMUP: { label: 'Warm-up', color: 'text-amber-400 bg-amber-950/20 border-amber-900/40' },
  STRENGTH: { label: 'Strength', color: 'text-orange-400 bg-orange-950/20 border-orange-900/40' },
  AMRAP: { label: 'AMRAP', color: 'text-lime-400 bg-lime-950/20 border-lime-900/40' },
  FOR_TIME: { label: 'For Time', color: 'text-red-400 bg-red-950/20 border-red-900/40' },
  EMOM: { label: 'EMOM', color: 'text-sky-400 bg-sky-950/20 border-sky-900/40' },
  INTERVALS: { label: 'Intervals', color: 'text-cyan-400 bg-cyan-950/20 border-cyan-900/40' },
  HOLD: { label: 'Hold', color: 'text-violet-400 bg-violet-950/20 border-violet-900/40' },
  COOLDOWN: { label: 'Cool-down', color: 'text-stone-400 bg-stone-900/40 border-stone-800/60' },
};
const BlockCard = ({ block, onStart, lastResult }) => {
  const style = BLOCK_STYLE[block.type] || BLOCK_STYLE.WARMUP;
  const showTimer = block.type !== 'WARMUP' && block.type !== 'COOLDOWN';
  return (
    <div className="bg-stone-900/40 border border-stone-800 rounded-2xl p-4 mb-2.5">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <span className={`px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-[0.15em] border ${style.color}`}>{style.label}</span>
        {block.config?.minutes && <span className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">{block.config.minutes}m</span>}
        {block.config?.capMinutes && <span className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">cap {block.config.capMinutes}m</span>}
        {block.config?.sets && <span className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">{block.config.sets}×{block.config.reps||''}</span>}
      </div>
      <h3 className="font-bold text-stone-100 text-base leading-tight mb-2">{block.name}</h3>
      {block.movements && block.movements.length > 0 && (
        <ul className="space-y-1 mb-2">
          {block.movements.map((m, i) => (
            <li key={i} className="text-sm text-stone-300 flex items-baseline gap-2">
              <span className="text-stone-600 text-xs">•</span><span>{m}</span>
            </li>
          ))}
        </ul>
      )}
      {block.notes && <p className="text-xs text-stone-500 italic mb-2">{block.notes}</p>}
      {lastResult && (
        <div className="text-[11px] text-stone-400 flex items-center gap-1.5 pt-2 border-t border-stone-800/60 mb-1">
          <Icons.Check size={12}/>
          <span>Last: {formatResult(lastResult)} · {new Date(lastResult.date).toLocaleDateString()}</span>
        </div>
      )}
      {showTimer && (
        <button onClick={onStart} className="mt-3 w-full gradient-orange text-white font-bold uppercase tracking-[0.15em] text-xs h-11 rounded-xl flex items-center justify-center gap-2 tap-scale shadow-lg shadow-orange-900/20">
          <Icons.Play size={14}/> Start workout
        </button>
      )}
    </div>
  );
};

const formatResult = (r) => {
  const v = r.value || {};
  if (v.mode === 'amrap') return `${v.rounds} rounds${v.timeSec?` in ${fmt(v.timeSec)}`:''}`;
  if (v.mode === 'fortime') return v.capped ? `Capped at ${fmt(v.timeSec)}` : fmt(v.timeSec);
  if (v.mode === 'rest') return `${v.setsCompleted} sets`;
  if (v.mode === 'intervals') return `${v.repsCompleted} reps`;
  if (v.timeSec) return fmt(v.timeSec);
  return 'logged';
};

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const DayCard = ({ day, dayIdx, onStartBlock, results, defaultOpen }) => {

    <div className="bg-stone-900/30 border border-stone-800 rounded-2xl overflow-hidden">

        <div className="w-10 h-10 rounded-xl gradient-orange flex items-center justify-center flex-shrink-0">
          <span className="text-[10px] font-extrabold uppercase tracking-wider text-white">{DAY_SHORT[dayIdx]}</span>

          {day?.title && <div className="text-xs text-stone-400 truncate">{day.title}</div>}
        </div>
        <div className="flex items-center gap-2 shrink-0">

};

// ---------- PROGRAMMING VIEW ----------
const ProgrammingView = ({ data, setData, openTimer, cloudActions }) => {
  const fileRef = useRef();
  const haptic = useHaptic();
  const week = data.selectedWeek;
  const programmeWeek = data.programme[week] || {};
  const programmedDayIdx = Object.keys(programmeWeek)
    .map(k => +k)
    .filter(i => programmeWeek[i]?.blocks?.length > 0)
    .sort((a,b)=>a-b);
  // Auto-detect today's day to open it by default
  const todayIdx = (new Date().getDay() + 6) % 7; // mon=0

  const setWeek = (n) => { haptic(5); setData({...data, selectedWeek: Math.max(1, n)}); };
  const handleUpload = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const targetWeek = json.week ?? week;
        const next = JSON.parse(JSON.stringify(data));
        next.programme[targetWeek] = { ...json.days };
        next.selectedWeek = targetWeek;
        setData(next);
        cloudActions?.programmeUploaded(targetWeek, json.days);
        const dayCount = Object.values(json.days || {}).filter(d => d?.blocks?.length > 0).length;
        haptic([10,30,10]);
        alert(`Loaded ${dayCount} day${dayCount===1?'':'s'} for week ${targetWeek}`);
      } catch (err) { alert('Invalid JSON: '+ err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  const clearWeek = () => {
    if (!confirm(`Clear all workouts for week ${week}?`)) return;
    haptic([20,30,20]);
    const next = JSON.parse(JSON.stringify(data));
    delete next.programme[week];
    setData(next);
    cloudActions?.programmeCleared(week);
  };

  return (
    <div>
      {/* Week selector — compact, full-width on mobile */}
      <div className="flex items-center gap-2 mb-4">
        <button onClick={()=>setWeek(week-1)} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Minus size={18}/></button>
        <div className="flex-1 h-11 bg-stone-900 border border-stone-800 rounded-xl flex items-center justify-center gap-2">
          <Icons.Calendar size={14} className="text-orange-500"/>
          <span className="text-stone-400 text-xs uppercase tracking-wider font-bold">Week</span>
          <span className="font-digits font-extrabold text-stone-100 text-lg">{week}</span>
        </div>
        <button onClick={()=>setWeek(week+1)} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Plus size={18}/></button>
      </div>

      {/* Action row */}
      <div className="grid grid-cols-2 gap-2 mb-5">
        <button onClick={()=>fileRef.current.click()} className="bg-stone-900 border border-stone-800 rounded-xl h-11 text-stone-200 flex items-center justify-center gap-2 tap-scale font-semibold text-sm">
          <Icons.Upload size={16}/> Upload
        </button>
        <button onClick={clearWeek} disabled={programmedDayIdx.length===0}
          className="bg-stone-900 border border-stone-800 rounded-xl h-11 text-stone-400 flex items-center justify-center gap-2 tap-scale font-semibold text-sm disabled:opacity-40">
          <Icons.X size={16}/> Clear week
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" onChange={handleUpload} className="hidden"/>
      </div>

      {programmedDayIdx.length === 0 ? (
        <div className="bg-stone-900/30 border border-dashed border-stone-800 rounded-2xl p-8 text-center">
          <Icons.Calendar size={36} className="mx-auto text-stone-700 mb-3"/>
          <h3 className="text-base font-bold text-stone-300 mb-1">No workout for week {week}</h3>
          <p className="text-stone-500 text-xs">Generate via Generator tab, then upload JSON</p>
        </div>
      ) : (
        <div className="space-y-2.5">
          {programmedDayIdx.map(i => (
            <DayCard
              key={i}
              day={programmeWeek[i]}
              dayIdx={i}
              defaultOpen={i === todayIdx || programmedDayIdx.length === 1}
              results={data.results}
              onStartBlock={(b) => openTimer(b, i, week)}
            />
          ))}
        </div>
      )}
    </div>
  );
};

  const g = data.generator;

    const newG = { ...g, ...patch };
    setData({ ...data, generator: newG });

  const buildPrompt = () => `# Vad Training — Programme Generation Request

Athlete: ${meta.name}
Weeks: ${g.weeks} (starting week ${g.startWeek})

Focus: ${g.focus}
Intensity: ${g.intensity}

## Guidance
${g.guidance}

For each week, return a JSON object matching this schema. The page accepts it via the Upload button.

\`\`\`

- WARMUP, COOLDOWN — display only, no timer
- STRENGTH — config { sets, reps, restSec, weightKg } → opens REST timer
- AMRAP — config { minutes } → AMRAP mode
- FOR_TIME — config { capMinutes } → FOR TIME mode
- EMOM — config { rounds } → EMOM mode

Day index: 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun.

Generate the full programme now.`;

// ---------- PROGRESS VIEW ----------
// Inline SVG sparkline/line chart for an exercise's progression
const ExerciseChart = ({ results }) => {
  // results sorted oldest → newest, plot whichever metric is most informative
  const points = useMemo(() => {
    return results
      .slice()
      .sort((a,b) => new Date(a.date).getTime() - new Date(b.date).getTime())
      .map(r => {
        const v = r.value || {};
        let metric = null;
        if (v.weightKg != null) metric = { label: 'kg', value: v.weightKg };
        else if (v.timeSec != null) metric = { label: 's', value: v.timeSec };
        else if (v.rounds != null) metric = { label: 'rds', value: v.rounds };
        else if (v.setsCompleted != null) metric = { label: 'sets', value: v.setsCompleted };
        else if (v.repsCompleted != null) metric = { label: 'reps', value: v.repsCompleted };
        return metric ? { date: r.date, ...metric } : null;
      })
      .filter(Boolean);
  }, [results]);

  if (points.length < 2) return (
    <div className="text-center text-xs text-stone-600 py-3 italic">Need at least 2 sessions to see progression.</div>
  );

  const W = 320, H = 110, P = 14;
  const xs = points.map((_,i) => i);
  const ys = points.map(p => p.value);
  const xMin = 0, xMax = xs.length - 1;
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yPad = (yMax - yMin) * 0.15 || 1;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const fx = (i) => P + (i - xMin) / Math.max(1, xMax - xMin) * (W - 2*P);
  const fy = (v) => H - P - (v - yLo) / Math.max(0.0001, yHi - yLo) * (H - 2*P);

  const path = points.map((p,i) => `${i===0?'M':'L'}${fx(i).toFixed(1)},${fy(p.value).toFixed(1)}`).join(' ');
  const areaPath = path + ` L${fx(xMax).toFixed(1)},${H-P} L${fx(0).toFixed(1)},${H-P} Z`;
  const last = points[points.length-1];
  const first = points[0];
  const delta = last.value - first.value;
  const trend = delta > 0 ? '↑' : delta < 0 ? '↓' : '→';
  const trendColor = delta > 0 ? 'text-emerald-400' : delta < 0 ? 'text-rose-400' : 'text-stone-400';

  return (
    <div>
      <div className="flex items-baseline justify-between mb-1.5">
        <span className="text-[10px] uppercase tracking-wider text-stone-500 font-bold">Progression</span>
        <span className={`text-xs font-digits font-bold tabular-nums ${trendColor}`}>{trend} {Math.abs(delta).toFixed(delta % 1 === 0 ? 0 : 1)}{last.label}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="rgb(249 115 22)" stopOpacity="0.4"/>
            <stop offset="100%" stopColor="rgb(249 115 22)" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* Min/max guide lines */}
        <line x1={P} y1={fy(yMin)} x2={W-P} y2={fy(yMin)} stroke="rgb(41 37 36)" strokeDasharray="2 4"/>
        <line x1={P} y1={fy(yMax)} x2={W-P} y2={fy(yMax)} stroke="rgb(41 37 36)" strokeDasharray="2 4"/>
        <path d={areaPath} fill="url(#chartFill)"/>
        <path d={path} fill="none" stroke="rgb(249 115 22)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map((p,i) => (
          <circle key={i} cx={fx(i)} cy={fy(p.value)} r={i===points.length-1 ? 3.5 : 2.5}
                  fill={i===points.length-1 ? 'rgb(249 115 22)' : 'rgb(245 158 11)'}
                  stroke="rgb(28 25 23)" strokeWidth="1.5"/>
        ))}
        <text x={P} y={fy(yMax) - 4} fill="rgb(120 113 108)" fontSize="9" fontFamily="monospace">{yMax}{last.label}</text>
        <text x={P} y={fy(yMin) + 11} fill="rgb(120 113 108)" fontSize="9" fontFamily="monospace">{yMin}{last.label}</text>
      </svg>
    </div>
  );
};

const ProgressView = ({ data }) => {
  const myResults = data.results;
  const [expanded, setExpanded] = useState(null);

  const grouped = useMemo(() => {
    const map = new Map();
    for (const r of myResults) {
      if (!r.blockName) continue;
      if (!map.has(r.blockName)) map.set(r.blockName, []);
      map.get(r.blockName).push(r);
    }
    // Each group sorted newest first; entries themselves sorted by total session count
    return [...map.entries()]
      .map(([name, list]) => ({
        name,
        results: list.sort((a,b) => new Date(b.date).getTime() - new Date(a.date).getTime()),
        count: list.length,
        last: list[0],
      }))
      .sort((a,b) => new Date(b.last.date).getTime() - new Date(a.last.date).getTime());
  }, [myResults]);

  const strongest = useMemo(() => {
    const lifts = myResults.filter(r => r.value?.weightKg);
    if (!lifts.length) return null;
    return lifts.reduce((a,b) => (b.value.weightKg > a.value.weightKg ? b : a));
  }, [myResults]);

  return (
    <div>
      {/* KPI cards */}
      <div className="grid grid-cols-3 gap-2 mb-4">
        <div className="card-teal rounded-2xl p-3">
          <div className="flex items-center gap-1.5 mb-2 text-sky-400"><Icons.Activity size={14}/></div>
          <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-1 font-bold leading-tight">Sessions<br/>Logged</div>
          <div className="font-digits font-extrabold text-2xl">{myResults.length}</div>
        </div>
        <div className="card-orange rounded-2xl p-3">
          <div className="flex items-center gap-1.5 mb-2 text-orange-400"><Icons.Trophy size={14}/></div>
          <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-1 font-bold leading-tight">Strongest<br/>Lift</div>
          <div className="font-digits font-extrabold text-xl">{strongest ? `${strongest.value.weightKg}kg` : 'N/A'}</div>
        </div>
        <div className="card-purple rounded-2xl p-3">
          <div className="flex items-center gap-1.5 mb-2 text-fuchsia-400"><Icons.Weight size={14}/></div>
          <div className="text-[10px] text-stone-400 uppercase tracking-wider mb-1 font-bold leading-tight">Exercises<br/>Tracked</div>
          <div className="font-digits font-extrabold text-2xl">{grouped.length}</div>
        </div>
      </div>

      <div className="bg-stone-900/30 border border-stone-800 rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <Icons.Bar size={16} className="text-orange-500"/>
          <h2 className="text-base font-bold flex-1">Exercises</h2>
          <span className="text-xs text-stone-500">{grouped.length} tracked</span>
        </div>

        {grouped.length === 0 ? (
          <div className="py-12 text-center">
            <Icons.Activity size={36} className="mx-auto text-stone-700 mb-3"/>
            <p className="text-stone-400 text-base font-semibold">No progress yet</p>
            <p className="text-stone-600 text-xs mt-1">Log a workout to see it here</p>
          </div>
        ) : (
          <div className="space-y-1.5">
            {grouped.map(g => {
              const isOpen = expanded === g.name;
              return (
                <div key={g.name} className="bg-stone-950/40 rounded-xl border border-stone-800/60 overflow-hidden">
                  <button
                    onClick={() => setExpanded(isOpen ? null : g.name)}
                    className="w-full flex items-center justify-between p-3 tap-scale text-left">
                    <div className="min-w-0 flex-1">
                      <div className="font-semibold text-stone-200 text-sm truncate">{g.name}</div>
                      <div className="text-[11px] text-stone-500 mt-0.5">
                        {g.count} session{g.count===1?'':'s'} · last {new Date(g.last.date).toLocaleDateString()}
                      </div>
                    </div>
                    <div className="font-digits font-bold text-stone-100 text-sm shrink-0 ml-2 mr-1.5">
                      {formatResult(g.last)}
                    </div>
                    <div className="text-stone-500">
                      {isOpen ? <Icons.ChevUp size={16}/> : <Icons.ChevDown size={16}/>}
                    </div>
                  </button>
                  {isOpen && (
                    <div className="px-3 pb-3 pt-1 border-t border-stone-900">
                      <div className="py-3">
                        <ExerciseChart results={g.results}/>
                      </div>
                      <div className="space-y-1">
                        <div className="text-[10px] uppercase tracking-wider text-stone-500 font-bold mb-1.5">All sessions</div>
                        {g.results.map(r => (
                          <div key={r.id} className="flex items-center justify-between py-1.5 text-xs">
                            <span className="text-stone-400">{new Date(r.date).toLocaleDateString()}</span>
                            <span className="font-digits font-bold text-stone-200 tabular-nums">{formatResult(r)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
};

// ---------- SYNC INDICATOR ----------
const SyncDot = ({ state }) => {
  if (state === 'disabled') return null;
  const cfg = {
    idle:    { color: 'bg-stone-500',   pulse: false, label: 'Offline mode' },
    syncing: { color: 'bg-amber-400',   pulse: true,  label: 'Syncing…' },
    synced:  { color: 'bg-emerald-500', pulse: false, label: 'Synced' },
    offline: { color: 'bg-rose-500',    pulse: true,  label: 'Cloud unreachable' },
  }[state] || { color: 'bg-stone-500', pulse: false, label: state };
  return (
    <div className="flex items-center gap-1.5 mr-1" title={cfg.label} aria-label={cfg.label}>
      <span className={`block w-2 h-2 rounded-full ${cfg.color} ${cfg.pulse ? 'animate-pulse' : ''}`}/>
    </div>
  );
};

// ---------- APP ----------
function App() {
  const [authed, setAuthed] = useState(isLoggedIn());
  const [profile, setProfile] = useState(getActiveProfile);  // null until picked
  const [data, setDataRaw] = useState(() => profile ? loadData(profile) : seedData());
  const [tab, setTab] = useState('programming');
  const [timer, setTimer] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  // Sync states: 'disabled' | 'idle' | 'syncing' | 'synced' | 'offline'
  const [sync, setSync] = useState(cloudEnabled() ? 'idle' : 'disabled');
  const haptic = useHaptic();
  const setData = (d) => { setDataRaw(d); if (profile) saveData(profile, d); };
  const meta = profile ? profileMeta(profile) : null;
  // Build a cloud client bound to the active profile. useMemo so callers get a
  // stable reference within a single profile session.
  const cloud = useMemo(() => cloudFor(profile), [profile]);

  // When the user picks a new profile (initial pick or post-switch), load its bucket.
  const onPickProfile = (id) => {
    setProfile(id);
    setDataRaw(loadData(id));
    setSync(cloudEnabled() ? 'idle' : 'disabled');
  };
  // From Settings → Switch profile.
  const onSwitchProfile = () => {
    clearActiveProfile();
    setProfile(null);
  };

  // Initial reconcile with server: pull snapshot, merge results, push local-only results up.
  // Re-runs when the active profile changes.
  useEffect(() => {
    if (!authed || !profile || !cloudEnabled()) return;
    let cancelled = false;
    (async () => {
      setSync('syncing');
      try {
        const snap = await cloud.snapshot();
        if (cancelled) return;
        const local = loadData(profile);
        const { merged, localOnly } = mergeResults(local.results, snap.results || []);
        const merged_data = {
          ...local,
          // Server programme is authoritative; local-only weeks are preserved by the spread
          programme: { ...local.programme, ...(snap.programme || {}) },
          results: merged,
          generator: snap.generator || local.generator,
        };
        setDataRaw(merged_data);
        saveData(profile, merged_data);
        // Push any local-only results to the server (fire and forget)
        for (const r of localOnly) {
          cloud.addResult({
            id: r.id, blockId: r.blockId, blockName: r.blockName,
            week: r.week, dayIdx: r.dayIdx, date: r.date, value: r.value,
          }).catch(()=>{});
        }
        setSync('synced');
      } catch (e) {
        if (!cancelled) setSync('offline');
      }
    })();
    return () => { cancelled = true; };
  }, [authed, profile]);

  // cloudActions: imperative pushes triggered by view-level mutations.
  // Each one is fire-and-forget — UI already updated via setData(), API failures show in indicator.
  const cloudActions = {
    programmeUploaded: (week, days) => {
      if (!cloudEnabled()) return;
      setSync('syncing');
      cloud.putProgramme(week, days).then(()=>setSync('synced')).catch(()=>setSync('offline'));
    },
    programmeCleared: (week) => {
      if (!cloudEnabled()) return;
      setSync('syncing');
      cloud.deleteProgramme(week).then(()=>setSync('synced')).catch(()=>setSync('offline'));
    },
    resultLogged: (r) => {
      if (!cloudEnabled()) return;
      setSync('syncing');
      cloud.addResult(r).then(()=>setSync('synced')).catch(()=>setSync('offline'));
    },
    generatorChanged: (g) => {
      if (!cloudEnabled()) return;
      // Debounce: only push 1s after the user stops typing
      clearTimeout(cloudActions._gtimer);
      cloudActions._gtimer = setTimeout(() => {
        setSync('syncing');
        cloud.putGenerator(g).then(()=>setSync('synced')).catch(()=>setSync('offline'));
      }, 1000);
    },
  };

  // Force a full resync from cloud (Settings button)
  const forceResync = async () => {
    if (!cloudEnabled()) { alert('Cloud sync is not configured'); return; }
    setSync('syncing');
    try {
      const snap = await cloud.snapshot();
      const local = loadData(profile);
      const { merged } = mergeResults(local.results, snap.results || []);
      const merged_data = {
        ...local,
        programme: { ...local.programme, ...(snap.programme || {}) },
        results: merged,
        generator: snap.generator || local.generator,
      };
      setData(merged_data);
      setSync('synced');
      alert(`Resynced ${meta.name} from cloud.`);
    } catch (e) {
      setSync('offline');
      alert('Resync failed: ' + e.message);
    }
  };

  // One-shot bulk push of localStorage to D1 (Settings button)
  const pushLocalToCloud = async () => {
    if (!cloudEnabled()) { alert('Cloud sync is not configured'); return; }
    if (!confirm(`Push ALL local programmes and results for ${meta.name} to the cloud? Existing cloud entries with the same week/result-id will be overwritten.`)) return;
    setSync('syncing');
    try {
      const local = loadData(profile);
      const r = await cloud.migrate({
        programme: local.programme || {},
        results: local.results || [],
        generator: local.generator || null,
      });
      setSync('synced');
      alert(`Pushed ${r.migrated.programmes} programmes and ${r.migrated.results} results.`);
    } catch (e) {
      setSync('offline');
      alert('Push failed: ' + e.message);
    }
  };

  if (!authed) return <LoginScreen onSuccess={()=>setAuthed(true)}/>;
  if (!profile) return <ProfilePicker onPick={onPickProfile}/>;

  const openTimer = (block, dayIdx, week) => {
    haptic(15);
    const t = blockToTimer(block);
    setTimer({ mode: t.mode, config: { ...t.config, workoutName: block.name }, blockId: block.id, blockName: block.name, dayIdx, week });
  };
  const logResult = (value, closeAfter = true) => {
    if (!timer) return;
    const result = {
      id: 'r_' + Date.now().toString(36),
      blockId: timer.blockId, blockName: timer.blockName,
      week: timer.week, dayIdx: timer.dayIdx,
      date: new Date().toISOString(),
      value,
    };
    setData({ ...data, results: [result, ...data.results] });
    cloudActions.resultLogged(result);
    if (closeAfter) setTimer(null);
  };
  const logout = () => { endSession(); setAuthed(false); };

  const tabs = [
    { id: 'programming', label: 'Today', icon: <Icons.Calendar size={18}/> },
    { id: 'progress', label: 'Progress', icon: <Icons.Bar size={18}/> },
  ];

  return (
    <div className="min-h-screen bg-stone-950 flex flex-col">
      {/* Compact header — no sticky on mobile to save space */}
      <header className="flex items-center justify-between px-4 pt-3 pb-3 border-b border-stone-900 pt-safe">
        <div className="flex items-center gap-2 min-w-0">
          <span className="gradient-text font-extrabold text-xl tracking-tight truncate">Vad Training</span>
          <span className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-[0.18em] text-white bg-gradient-to-br ${meta.gradient} shrink-0`}>{meta.name}</span>
        </div>
        <div className="flex items-center gap-1">
          <SyncDot state={sync}/>
          <button onClick={()=>setSettingsOpen(true)} className="p-2.5 rounded-full text-stone-400 tap-scale"><Icons.Settings size={20}/></button>
          <button onClick={logout} className="p-2.5 rounded-full text-stone-400 tap-scale"><Icons.LogOut size={20}/></button>
        </div>
      </header>
      {/* Main content with bottom padding for nav */}
      <main className="flex-1 px-4 pt-4 pb-24">
        {tab === 'programming' && <ProgrammingView data={data} setData={setData} openTimer={openTimer} cloudActions={cloudActions}/>}
        {tab === 'progress' && <ProgressView data={data}/>}
      </main>
      {/* Bottom tab bar — iOS native style, fixed to bottom */}
      <nav className="fixed bottom-0 inset-x-0 z-30 bg-stone-950/95 backdrop-blur-xl border-t border-stone-900 pb-safe">
        <div className="grid grid-cols-2 gap-1 p-2 max-w-md mx-auto">
          {tabs.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={()=>{setTab(t.id); haptic(8);}}
                className="flex flex-col items-center justify-center py-2 rounded-xl tap-scale">
                <div className={active ? 'text-orange-500' : 'text-stone-500'}>{t.icon}</div>
                <span className={`text-[10px] mt-1 font-bold uppercase tracking-wider ${active ? 'text-stone-100' : 'text-stone-500'}`}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
      {timer && <ChronoTimer initialMode={timer.mode} initialConfig={timer.config} onClose={()=>setTimer(null)} onLog={logResult}/>}
      {settingsOpen && <SettingsModal onClose={()=>setSettingsOpen(false)} sync={sync} forceResync={forceResync} pushLocalToCloud={pushLocalToCloud} profile={profile} onSwitchProfile={onSwitchProfile}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
