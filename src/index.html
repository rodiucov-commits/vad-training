// ---------- PROFILES ----------
// Two profiles share the same password and Cloudflare backend; data is fully
// partitioned by profile id (separate localStorage buckets, ?profile= on every API call).
const PROFILES = [
  { id: 'vad',   name: 'Vad',   gradient: 'from-orange-500 to-red-500',     glow: 'shadow-orange-900/30' },
  { id: 'tatka', name: 'Tatka', gradient: 'from-pink-500 to-rose-500',      glow: 'shadow-rose-900/30'   },
];

  const setup=new URLSearchParams(location.hash.slice(1));
  if(setup.has('setup')&&PROFILES.some(p=>p.id===setup.get('profile')))return setup.get('profile');
  const stored = localStorage.getItem(PROFILE_KEY);
  if (stored && PROFILES.some(p => p.id === stored)) return stored;
  return null;  // not yet picked → show profile picker after login
};

// ---------- AUTH ----------
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const SESSION_KEY = 'vt_session_v1';
const HASH_KEY = 'vt_pwhash_v1';
const endSession = () => localStorage.removeItem(SESSION_KEY);

// ---------- CLOUD API ----------
// Paste your bearer token here to enable cross-device sync via Cloudflare D1.
// Leave both blank to fall back to pure localStorage mode (works offline / from disk).
const API_BASE  = 'https://rodiucov.com';
const cloudEnabled=()=>!!API_BASE;
async function authFetch(action,profile,body){
 const response=await fetch(API_BASE+'/api/auth/'+action+'?profile='+encodeURIComponent(profile),{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},...(body?{body:JSON.stringify(body)}:{})});
 const data=await response.json().catch(()=>({error:'Could not reach sign-in service'}));
 if(!response.ok){const error=Error(data.error||'Sign-in failed');error.status=response.status;throw error;}return data;
}

async function apiFetch(path, opts = {}, profile = null) {
  // Append ?profile=<id> (or &profile=) to every authed call so server scopes
  // reads/writes correctly. /api/health doesn't care, but the harmless extra
  // query string doesn't break it either.
  let url = API_BASE + path;
  if (profile) {
    const sep = url.includes('?') ? '&' : '?';
    url = url + sep + 'profile=' + encodeURIComponent(profile);
  }
  const r = await fetch(url, {
    ...opts,
    credentials:'same-origin',
    headers: {
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    if(r.status===401)window.dispatchEvent(new CustomEvent('vt-auth-expired',{detail:{profile}}));
    if (opts.method==='DELETE' && r.status===404) return null;
    const txt = await r.text().catch(()=>'');
    throw new Error(`API ${r.status}: ${txt || r.statusText}`);
  }
  if (r.status === 204) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('application/json') ? r.json() : r.text();
}

// Build a cloud client bound to a specific profile. We re-create this when the

  putProgramme:     (week, days) => apiFetch('/api/programme', { method:'PUT', body: JSON.stringify({ week, days }) }, profile),

  addResult:        (r) => apiFetch('/api/results', { method:'POST', body: JSON.stringify(r) }, profile),
  deleteResult:     (id) => apiFetch(`/api/results/${encodeURIComponent(id)}`, { method:'DELETE' }, profile),
  putGenerator:     (g) => apiFetch('/api/generator', { method:'PUT', body: JSON.stringify(g) }, profile),
  migrate:          (payload) => apiFetch('/api/migrate', { method:'POST', body: JSON.stringify(payload) }, profile),
});

// Merge local and server results: union by id, server wins on dup, sort newest first.
function mergeResults(localArr, serverArr) {
  const byId = new Map();
  for (const r of (localArr || [])) byId.set(r.id, { ...r, _origin: 'local' });
  for (const r of (serverArr || [])) byId.set(r.id, { ...r, _origin: 'server' });
  const merged = [...byId.values()]
    .map(({ _origin, ...rest }) => rest)
    .sort((a,b) => new Date(b.date).getTime() - new Date(a.date).getTime());
  const localIds  = new Set((localArr  || []).map(r => r.id));
  const serverIds = new Set((serverArr || []).map(r => r.id));
  const localOnly = (localArr || []).filter(r => !serverIds.has(r.id));
  return { merged, localOnly };
}

};

// ---------- AUDIO + WAKE LOCK ----------
function useAudio(muted) {
  const ctxRef = useRef(null);
  const ensureCtx = async () => {
    // Lazily create AudioContext on first call. iOS requires this to be on a user gesture,
    // which is satisfied because every entry point (start, mode switch, tap-counter) is one.
    if (!ctxRef.current) {
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { return null; }
    }
    const ctx = ctxRef.current;
    // iOS leaves the context in 'suspended' or 'interrupted' state after sleep/background.
    // resume() returns a promise; if we don't await it, the first beep after sleep is silent.
    if (ctx.state !== 'running') {
      try { await ctx.resume(); } catch {}
    }
    // If resume failed (Safari sometimes wedges the context), throw it away and try once more.
    if (ctx.state !== 'running') {
      try { ctx.close(); } catch {}
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { ctxRef.current = null; return null; }
      try { await ctxRef.current.resume(); } catch {}
    }
    return ctxRef.current && ctxRef.current.state === 'running' ? ctxRef.current : null;
  };
  const beep = async (freq, dur, vol=0.3) => {
    if (muted) return;
    const ctx = await ensureCtx(); if (!ctx) return;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = 'sine';
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
    osc.start(); osc.stop(ctx.currentTime + dur/1000);
  };
  return {
    tick: () => beep(820, 70, 0.18), tickWarn: () => beep(880, 110, 0.28),
    go: () => beep(1100, 260, 0.38), rest: () => beep(480, 220, 0.28),
    sideSwitch: () => beep(950, 140, 0.28),
    done: async () => { await beep(820,130,0.3); setTimeout(()=>beep(1050,130,0.3),160); setTimeout(()=>beep(1350,280,0.34),320); },
    unlock: () => beep(600, 10, 0.001),
  };
}
function useWakeLock(active) {
  useEffect(() => {
    let lock = null;
    if (active && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(l=>{lock=l;}).catch(()=>{});
    return () => { if (lock) lock.release().catch(()=>{}); };
  }, [active]);

const PRESTART_SEC = 10;

function ChronoTimer({ initialMode='rest', initialConfig={}, onClose, onLog }) {
  const [mode, setMode] = useState(initialMode);
  const [soundOn, setSoundOnState] = useState(getSound);
  const setSoundOn = (v) => { setSoundOnState(v); setSoundPref(v); };
  const audio = useAudio(!soundOn);
  const haptic = useHaptic();
  const landscape = useOrientation();

  const [restSec, setRestSec] = useState(initialConfig.restSec ?? 150);
  const [restSets, setRestSets] = useState(initialConfig.restSets ?? 4);
  const [amrapMin, setAmrapMin] = useState(initialConfig.amrapMin ?? 20);
  const [forTimeCapMin, setForTimeCapMin] = useState(initialConfig.capMin ?? 15);
  const [emomRounds, setEmomRounds] = useState(initialConfig.emomRounds ?? 12);
  // EMOM Blocks state (for minute-by-minute work/rest within a block)
  const [emomBlockWorkMin, setEmomBlockWorkMin] = useState(initialConfig.emomBlockWorkMin ?? 12);
  const [emomBlockRestMin, setEmomBlockRestMin] = useState(initialConfig.emomBlockRestMin ?? 4);
  const [emomBlockCount, setEmomBlockCount] = useState(initialConfig.emomBlockCount ?? 3);
  const [emomBlockIdx, setEmomBlockIdx] = useState(1);
  const [emomBlockExercise, setEmomBlockExercise] = useState(initialConfig.emomBlockExercise ?? '');
  const [intWork, setIntWork] = useState(initialConfig.intWork ?? 180);
  const [intRest, setIntRest] = useState(initialConfig.intRest ?? 90);
  const [intRounds, setIntRounds] = useState(initialConfig.intRounds ?? 6);
  const [holdSec, setHoldSec] = useState(initialConfig.holdSec ?? 20);
  const [holdSides, setHoldSides] = useState(initialConfig.holdSides ?? 2);
  const [holdRounds, setHoldRounds] = useState(initialConfig.holdRounds ?? 3);

  const [extraReps, setExtraReps] = useState(0);
  const [includeFinalRest, setIncludeFinalRest] = useState(initialConfig.includeFinalRest === true);
  const [countdownSec, setCountdownSec] = useState(initialConfig.countdownSec ?? 240);
  const [completedSets, setCompletedSets] = useState(0);
  const [roundEntries, setRoundEntries] = useState([]);
  const manualElapsedRef = useRef(0);
  const lastSegmentRef = useRef(-1);
  const [phase, setPhase] = useState('idle');
  const [timerSettingsOpen, setTimerSettingsOpen] = useState(true);
  useEffect(() => {
    if (phase === 'running' || phase === 'prestart') setTimerSettingsOpen(false);
    if (phase === 'idle') setTimerSettingsOpen(true);
  }, [phase, mode]);
  const [elapsed, setElapsed] = useState(0);
  const [setIdx, setSetIdx] = useState(1);
  const [rounds, setRounds] = useState(0);
  const [intervalIdx, setIntervalIdx] = useState(1);
  const [isWork, setIsWork] = useState(true);
  const [sideIdx, setSideIdx] = useState(1);
  const [holdRoundIdx, setHoldRoundIdx] = useState(1);
  // For STRENGTH/rest mode: 'set' = stopwatch counting up during the lift,
  // 'rest' = countdown after user taps DONE
  const [restPhase, setRestPhase] = useState('set');
  const [showWod, setShowWod] = useState(!!initialConfig.workoutText);

  const startRef = useRef(null), pausedElapsedRef = useRef(0), lastBeepSec = useRef(-1);
  useWakeLock(phase === 'running' || phase === 'prestart');
  useEffect(() => { fullReset(); }, [mode]);

  function fullReset() {
    setExtraReps(0); lastSegmentRef.current = -1;
    setCompletedSets(0); setRoundEntries([]); manualElapsedRef.current = 0;
    setEmomBlockIdx(1);
    setPhase('idle'); setElapsed(0); setSetIdx(1); setRounds(0);
    setIntervalIdx(1); setIsWork(true); setSideIdx(1); setHoldRoundIdx(1);
    setRestPhase('set');
    startRef.current = null; pausedElapsedRef.current = 0; lastBeepSec.current = -1;
  }
  useEffect(() => {
    if (phase !== 'running' && phase !== 'prestart') return;
    if (!startRef.current) startRef.current = Date.now() - pausedElapsedRef.current * 1000;
    const id = setInterval(() => setElapsed((Date.now() - startRef.current)/1000), 80);
    return () => clearInterval(id);
  }, [phase]);

  const plan = WorkoutClock.build(mode, {amrapMin,capMin:forTimeCapMin,emomRounds,minuteCycle:mode===initialMode ? initialConfig.minuteCycle : [],
    blockWorkMin:emomBlockWorkMin,blockRestMin:emomBlockRestMin,blockCount:emomBlockCount,exercise:emomBlockExercise,
    intWork,intRest,intRounds,includeFinalRest,holdSec,holdSides,holdRounds,countdownSec});
  const clock = WorkoutClock.at(plan, elapsed);
  useEffect(() => {
    if (phase === 'prestart') {
      const rem=PRESTART_SEC-elapsed;
      if (rem<=3 && rem>0 && lastBeepSec.current!==Math.ceil(rem)) { lastBeepSec.current=Math.ceil(rem); audio.tickWarn(); }
      if (rem<=0) {
        audio.go(); startRef.current=Date.now(); pausedElapsedRef.current=0;
        lastBeepSec.current=-1; lastSegmentRef.current=-1; setElapsed(0); setPhase('running');
      }
      return;
    }
    if (phase!=='running') return;
    if (mode==='rest' || mode==='circuit') {
      if (restPhase==='rest') {
        const remaining=restSec-elapsed;
        if (remaining<=0) {
          if (setIdx>=restSets) { setElapsed(restSec); setPhase('done'); audio.done(); }
          else {
            manualElapsedRef.current+=restSec;
            setSetIdx(i=>i+1); setRestPhase('set'); startRef.current=Date.now();
            pausedElapsedRef.current=0; lastBeepSec.current=-1; setElapsed(0); audio.go();
          }
        } else if (remaining<=3 && lastBeepSec.current!==Math.ceil(remaining)) { lastBeepSec.current=Math.ceil(remaining); audio.tick(); }
      }
      return;
    }
    if (!plan.segments.length) return;
    if (clock.done) { setElapsed(plan.totalSec); setPhase('done'); audio.done(); haptic([30,30,30,30,30]); return; }
    if (lastSegmentRef.current!==clock.index) {
      if (lastSegmentRef.current!==-1) { clock.segment.phase==='rest' ? audio.rest() : audio.go(); haptic(20); }
      lastSegmentRef.current=clock.index; lastBeepSec.current=-1;
    }
    if (clock.remaining<=3 && clock.remaining>0 && lastBeepSec.current!==Math.ceil(clock.remaining)) {
      lastBeepSec.current=Math.ceil(clock.remaining); audio.tick();
    }
  }, [elapsed, phase, mode]);

      startRef.current = Date.now(); pausedElapsedRef.current = 0; lastBeepSec.current = -1;
      setElapsed(0); setPhase('prestart');
    } else if (phase === 'paused') setPhase('running');
  };
  const skipPrestart = () => {
    if (phase !== 'prestart') return;
    haptic(20);
    audio.go(); startRef.current = Date.now(); pausedElapsedRef.current = 0;
    lastBeepSec.current = -1; setElapsed(0); setPhase('running');
  };
  const pause = () => { if (phase === 'running') { haptic(10); pausedElapsedRef.current = elapsed; startRef.current = null; setPhase('paused'); } };
  // Completing the final set/round finishes immediately unless final rest is explicitly requested.

    startRef.current=Date.now(); pausedElapsedRef.current=0; lastBeepSec.current=-1; setElapsed(0);
    if (restSec>0) { setRestPhase('rest'); audio.rest(); }
    else if (setIdx<restSets) { setSetIdx(i=>i+1); audio.go(); }
    else { setPhase('done'); audio.done(); }
  };

  const view=WorkoutClock.describe(plan,elapsed);

  if (mode==='stopwatch') { big=fmt(elapsed); phaseLbl='RUNNING'; context=''; }

  const Step = ({label, value, set, min=0, max=999, step=1, suffix}) => (

      </div>
    </div>
  );
  const renderConfig = () => {
    if (phase === 'running' || phase === 'prestart') return null;
    const w = "grid grid-cols-3 gap-2 px-4 py-4";
    if (mode==='countdown') return <div className={w}><Step label="Seconds" value={countdownSec} set={setCountdownSec} min={5} step={5} suffix="s"/></div>;
    if (mode==='circuit') return <div className={w}><Step label="Rounds" value={restSets} set={setRestSets} min={1} max={50}/><Step label="Rest" value={restSec} set={setRestSec} min={0} step={5} suffix="s"/></div>;
    if (mode === 'rest') return <div className={w}><Step label="Rest" value={restSec} set={setRestSec} min={5} step={5} suffix="s"/><Step label="Sets" value={restSets} set={setRestSets} min={1} max={20}/><Step label="Set #" value={setIdx} set={setSetIdx} min={1} max={restSets}/></div>;

        {block.config?.capMinutes && <span className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">cap {block.config.capMinutes}m</span>}

        </div>

const formatResult = (r) => {
  const v = r.value || {};
  if (v.mode === 'amrap') return `${v.rounds} rounds${v.extraReps ? ` + ${v.extraReps} reps` : ''}${v.timeSec?` in ${fmt(v.timeSec)}`:''}`;
  if (v.mode === 'fortime') return v.capped ? `Capped at ${fmt(v.timeSec)}` : fmt(v.timeSec);
  if (v.mode === 'rest') return `${v.setsCompleted} sets`;
  if (v.mode === 'intervals') return `${v.intervalsCompleted ?? v.repsCompleted} intervals${v.completed === false ? ' · partial' : ''}`;
  if (v.mode === 'circuit') return `${v.roundsCompleted} rounds`;
  if (v.timeSec) return fmt(v.timeSec);
  return 'logged';
};

const IMPORT_FULL_PROMPT = IMPORT_PROMPT + '\n' + IMPORT_EXAMPLE;

const VALID_BLOCK_TYPES = Object.keys(BLOCK_STYLE);

// Normalize + validate one block. Returns { block } or { error }.
const normalizeBlock=(b,where)=>{try{return {block:TrainingCore.block(b,where)};}catch(e){return {error:e.message};}};
const normalizeDay=(d,where)=>{try{return {day:TrainingCore.day(d,where)};}catch(e){return {error:e.message};}};

const ImportView = ({ data, setData, cloudActions, onViewWeek }) => {
  const haptic = useHaptic();
  const todayIdx = (new Date().getDay() + 6) % 7;
  const [scope, setScope] = useState('week'); // 'week' | 'day'
  const [weekNum, setWeekNum] = useState(data.selectedWeek || 1);
  const [dayIdx, setDayIdx] = useState(todayIdx);
  const [text, setText] = useState('');
  const [error, setError] = useState('');
  const [parsed, setParsed] = useState(null); // { days } normalized
  const [showDocs, setShowDocs] = useState(false);
  const [copied, setCopied] = useState(false);
  const [uploaded, setUploaded] = useState('');

  const validate = () => {
    setError(''); setParsed(null); setUploaded('');
    let json;
    try { json = JSON.parse(text); } catch (e) { setError('Invalid JSON: ' + e.message); return; }
    if (json.week && Number.isFinite(+json.week)) setWeekNum(+json.week);
    let rawDays;
    if (scope === 'week') {
      rawDays = json.days;
      if (!rawDays || typeof rawDays !== 'object' || Array.isArray(rawDays) || !Object.keys(rawDays).length) { setError('Full-week import needs a "days" object keyed "0".."6" (0 = Monday).'); return; }
    } else {
      // Single day: accept a bare day object, or {"days":{"X":{...}}} and take the first entry
      if (json.days && typeof json.days === 'object') {
        const keys = Object.keys(json.days);
        if (!keys.length) { setError('"days" object is empty.'); return; }
        rawDays = { [dayIdx]: json.days[keys[0]] };
      } else {
        rawDays = { [dayIdx]: json };
      }
    }
    const days = {};
    for (const k of Object.keys(rawDays)) {
      const di = +k;
      if (!Number.isInteger(di) || di < 0 || di > 6) { setError(`Day key "${k}" must be 0–6 (0 = Monday).`); return; }
      const r = normalizeDay(rawDays[k], `Day ${k} (${DAY_NAMES[di]})`);
      if (r.error) { setError(r.error); return; }
      days[di] = r.day;
    }
    try { const checked=TrainingCore.programme({week:json.week??weekNum,days},weekNum); setParsed({days:checked.days}); } catch(e) { setError(e.message); return; }
    haptic([10,30,10]);
  };

  const upload = () => {
    if (!parsed) return;
    if (scope==='week' && data.programme[weekNum] && !confirm(`Replace all existing workouts in week ${weekNum}?`)) return;
    const next = JSON.parse(JSON.stringify(data));
    let daysToPush;
    if (scope === 'week') {
      next.programme[weekNum] = parsed.days;
      daysToPush = parsed.days;
    } else {
      const existing = next.programme[weekNum] || {};
      const merged = { ...existing, ...parsed.days };
      next.programme[weekNum] = merged;
      daysToPush = merged;
    }
    next.selectedWeek = weekNum;
    next._weekSelectionMode = 'manual';
    next._weekSelectionDate = TrainingCore.localDate();
    if (setData(next)===false) return;
    const queued=cloudActions?.programmeUploaded(weekNum, daysToPush);
    haptic([15,40,15]);
    setUploaded(queued===false?'Saved locally; upload needs attention':scope === 'week'
      ? `Week ${weekNum} saved locally / queued — ${Object.keys(parsed.days).length} day(s).`
      : `${DAY_NAMES[Object.keys(parsed.days)[0]]} of week ${weekNum} saved locally / queued.`);
    setText(''); setParsed(null);
  };

  const copyExample = () => {
    navigator.clipboard?.writeText(IMPORT_FULL_PROMPT).then(() => { setCopied(true); setTimeout(()=>setCopied(false), 1500); });
  };

  const previewDays = parsed ? Object.keys(parsed.days).map(k=>+k).sort((a,b)=>a-b) : [];

  return (
    <div>
      {/* Scope toggle */}
      <div className="grid grid-cols-2 gap-2 mb-3">
        {[{id:'week',label:'Full week'},{id:'day',label:'Single day'}].map(s => (
          <button key={s.id} onClick={()=>{setScope(s.id); setParsed(null); setError(''); haptic(5);}}
            className={`h-11 rounded-xl font-bold text-sm uppercase tracking-wider tap-scale border ${scope===s.id ? 'gradient-orange text-white border-transparent' : 'bg-stone-900 border-stone-800 text-stone-400'}`}>{s.label}</button>
        ))}
      </div>

      {/* Week + day selectors */}
      <div className="flex items-center gap-2 mb-3">
        <button onClick={()=>{setWeekNum(w=>Math.max(1,w-1));setParsed(null);}} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Minus size={18}/></button>
        <div className="flex-1 h-11 bg-stone-900 border border-stone-800 rounded-xl flex items-center justify-center gap-2">
          <Icons.Calendar size={14} className="text-orange-500"/>
          <span className="text-stone-400 text-xs uppercase tracking-wider font-bold">Week</span>
          <span className="font-digits font-extrabold text-stone-100 text-lg">{weekNum}</span>
        </div>
        <button onClick={()=>{setWeekNum(w=>Math.min(53,w+1));setParsed(null);}} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Plus size={18}/></button>
      </div>
      {scope === 'day' && (
        <div className="grid grid-cols-7 gap-1 mb-3">
          {DAY_SHORT.map((d, i) => (
            <button key={i} onClick={()=>{setDayIdx(i);setParsed(null); haptic(5);}}
              className={`h-9 rounded-lg text-[10px] font-extrabold uppercase tracking-wider tap-scale border ${dayIdx===i ? 'gradient-orange text-white border-transparent' : 'bg-stone-900 border-stone-800 text-stone-500'}`}>{d}</button>
          ))}
        </div>
      )}

      {/* Paste area */}
      <textarea
        value={text}
        onChange={e=>{setText(e.target.value); setParsed(null); setError(''); setUploaded('');}}
        placeholder={scope==='week' ? 'Paste full-week JSON here… ({"week":…,"days":{…}})' : 'Paste one day JSON here… ({"title":…,"blocks":[…]})'}
        className="w-full h-44 bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 font-mono placeholder:text-stone-600 focus:outline-none focus:border-orange-700 resize-y mb-2"
      />
      {error && <div className="mb-2 text-xs text-red-400 bg-red-950/30 border border-red-900/50 rounded-xl px-3 py-2">{error}</div>}
      {uploaded && (
        <div className="mb-2 text-xs text-lime-400 bg-lime-950/30 border border-lime-900/50 rounded-xl px-3 py-2 flex items-center justify-between gap-2">
          <span>{uploaded}</span>
          <button onClick={onViewWeek} className="text-lime-300 font-bold uppercase tracking-wider underline shrink-0">View</button>
        </div>
      )}

      {/* Actions */}
      <div className="grid grid-cols-2 gap-2 mb-4">
        <button onClick={validate} disabled={!text.trim()}
          className="h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-200 flex items-center justify-center gap-2 tap-scale font-semibold text-sm disabled:opacity-40">

const ProgrammingView = ({ data, setData, openTimer, cloudActions }) => {
  const fileRef = useRef();
  const haptic = useHaptic();
  const week = data.selectedWeek;
  const programmeWeek = data.programme[week] || {};
  const weekNotes = TrainingCore.programmeNotes(programmeWeek);
  const programmedDayIdx = Object.keys(programmeWeek)
    .map(k => +k)
    .filter(i => programmeWeek[i]?.blocks?.length > 0)
    .sort((a,b)=>a-b);
  // Auto-detect today's day to open it by default
  const todayIdx = (new Date().getDay() + 6) % 7; // mon=0

  const setWeek = (n) => { haptic(5); setData({...data, selectedWeek: Math.max(1,Math.min(53,n)), _weekSelectionMode:'manual', _weekSelectionDate:TrainingCore.localDate()}); };
  const handleUpload = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = TrainingCore.programme(JSON.parse(reader.result),week);
        const targetWeek = json.week;
        if (data.programme[targetWeek] && !confirm(`Replace all workouts in week ${targetWeek}?`)) return;
        const next = JSON.parse(JSON.stringify(data));
        next.programme[targetWeek] = { ...json.days };
        next.selectedWeek = targetWeek;
        next._weekSelectionMode = 'manual';
        next._weekSelectionDate = TrainingCore.localDate();
        if (setData(next)===false) return;
        cloudActions?.programmeUploaded(targetWeek, json.days);
        const dayCount = Object.values(json.days || {}).filter(d => d?.blocks?.length > 0).length;
        haptic([10,30,10]);
        alert(`Loaded ${dayCount} day${dayCount===1?'':'s'} for week ${targetWeek}`);
      } catch (err) { alert('Invalid JSON: '+ err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  const clearWeek = () => {
    if (!confirm(`Clear all workouts for week ${week}?`)) return;
    haptic([20,30,20]);
    const next = JSON.parse(JSON.stringify(data));
    delete next.programme[week];
    if (setData(next)===false) return;
    cloudActions?.programmeCleared(week);
  };

  return (
    <div>
      {/* Week selector — compact, full-width on mobile */}
      <div className="flex items-center gap-2 mb-4">
        <button aria-label="Previous week" onClick={()=>setWeek(week-1)} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Minus size={18}/></button>
        <div className="flex-1 h-11 bg-stone-900 border border-stone-800 rounded-xl flex items-center justify-center gap-2">
          <Icons.Calendar size={14} className="text-orange-500"/>
          <span className="text-stone-400 text-xs uppercase tracking-wider font-bold">Programme week</span>
          <span className="font-digits font-extrabold text-stone-100 text-lg">{week}</span>
        </div>
        <button aria-label="Next week" onClick={()=>setWeek(week+1)} className="w-11 h-11 bg-stone-900 border border-stone-800 rounded-xl text-stone-400 flex items-center justify-center tap-scale shrink-0"><Icons.Plus size={18}/></button>
      </div>

      <button className="mb-3 text-sm text-orange-300 underline" onClick={()=>setData(TrainingCore.selectCurrentWeek(data,new Date(),true))}>Jump to current week</button>
      {weekNotes.shared && <details key={week} className="mb-4 rounded-xl border border-stone-800 bg-stone-900/30 px-4 py-3">
        <summary className="text-sm text-stone-300 font-semibold cursor-pointer">Programme guidance &amp; safety</summary>
        <p className="text-sm text-stone-400 whitespace-pre-line mt-3">{weekNotes.shared}</p>
      </details>}
      {/* Action row */}
      <div className="grid grid-cols-2 gap-2 mb-5">
        <button onClick={()=>fileRef.current.click()} className="bg-stone-900 border border-stone-800 rounded-xl h-11 text-stone-200 flex items-center justify-center gap-2 tap-scale font-semibold text-sm">
          <Icons.Upload size={16}/> Upload
        </button>
        <button onClick={clearWeek} disabled={programmedDayIdx.length===0}
          className="bg-stone-900 border border-stone-800 rounded-xl h-11 text-stone-400 flex items-center justify-center gap-2 tap-scale font-semibold text-sm disabled:opacity-40">
          <Icons.X size={16}/> Clear week
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" onChange={handleUpload} className="hidden"/>
      </div>

      {programmedDayIdx.length === 0 ? (
        <div className="bg-stone-900/30 border border-dashed border-stone-800 rounded-2xl p-8 text-center">
          <Icons.Calendar size={36} className="mx-auto text-stone-700 mb-3"/>
          <h3 className="text-base font-bold text-stone-300 mb-1">No workout for week {week}</h3>
          <p className="text-stone-500 text-xs">Import a programme using the Import tab</p>
        </div>
      ) : (
        <div className="space-y-2.5">
          {programmedDayIdx.map(i => (
            <DayCard
              key={i}
              week={week}
              day={programmeWeek[i]}
              displayNotes={weekNotes.dayNotes[i]}
              dayIdx={i}
              defaultOpen={i === todayIdx || programmedDayIdx.length === 1}
              results={data.results}
              onStartBlock={(b) => openTimer(b, i, week)}
            />
          ))}
        </div>
      )}
    </div>
  );
};

// Inline SVG sparkline/line chart for an exercise's progression
const ExerciseChart = ({ results }) => {
  // results sorted oldest → newest, plot whichever metric is most informative
  const points = useMemo(() => {
    return results
      .slice()
      .sort((a,b) => new Date(a.date).getTime() - new Date(b.date).getTime())
      .map(r => {
        const metric=TrainingCore.metric(r.value||{});
        if(metric && !Number.isFinite(metric.value))return null;
        return metric ? { date: r.date, ...metric, label:metric.unit } : null;
      })
      .filter(Boolean)
      .filter((point,_,all)=>point.unit===all[all.length-1]?.unit);
  }, [results]);

  if (points.length < 2) return (
    <div className="text-center text-xs text-stone-600 py-3 italic">Need two comparable performance scores. Prescribed duration and partial sessions are not PRs.</div>
  );

  const W = 320, H = 110, P = 14;
  const xs = points.map((_,i) => i);
  const ys = points.map(p => p.value);
  const xMin = 0, xMax = xs.length - 1;
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yPad = (yMax - yMin) * 0.15 || 1;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const fx = (i) => P + (i - xMin) / Math.max(1, xMax - xMin) * (W - 2*P);
  const fy = (v) => H - P - (v - yLo) / Math.max(0.0001, yHi - yLo) * (H - 2*P);

  const path = points.map((p,i) => `${i===0?'M':'L'}${fx(i).toFixed(1)},${fy(p.value).toFixed(1)}`).join(' ');
  const areaPath = path + ` L${fx(xMax).toFixed(1)},${H-P} L${fx(0).toFixed(1)},${H-P} Z`;
  const last = points[points.length-1];
  const first = points[0];
  const tiedRounds=last.unit==='rounds'&&last.value===first.value;
  const delta=tiedRounds?(last.extra||0)-(first.extra||0):last.value-first.value;
  const trend = delta > 0 ? '↑' : delta < 0 ? '↓' : '→';
  const better=last.higher?delta>0:delta<0;
  const trendColor=delta===0?'text-stone-400':better?'text-emerald-400':'text-rose-400';

  return (
    <div>
      <div className="flex items-baseline justify-between mb-1.5">
        <span className="text-[10px] uppercase tracking-wider text-stone-500 font-bold">Progression</span>
        <span className={`text-xs font-digits font-bold tabular-nums ${trendColor}`}>{trend} {Math.abs(delta).toFixed(delta % 1 === 0 ? 0 : 1)}{tiedRounds?'reps':last.label}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="rgb(249 115 22)" stopOpacity="0.4"/>
            <stop offset="100%" stopColor="rgb(249 115 22)" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* Min/max guide lines */}
        <line x1={P} y1={fy(yMin)} x2={W-P} y2={fy(yMin)} stroke="rgb(41 37 36)" strokeDasharray="2 4"/>
        <line x1={P} y1={fy(yMax)} x2={W-P} y2={fy(yMax)} stroke="rgb(41 37 36)" strokeDasharray="2 4"/>
        <path d={areaPath} fill="url(#chartFill)"/>
        <path d={path} fill="none" stroke="rgb(249 115 22)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map((p,i) => (
          <circle key={i} cx={fx(i)} cy={fy(p.value)} r={i===points.length-1 ? 3.5 : 2.5}
                  fill={i===points.length-1 ? 'rgb(249 115 22)' : 'rgb(245 158 11)'}
                  stroke="rgb(28 25 23)" strokeWidth="1.5"/>
        ))}
        <text x={P} y={fy(yMax) - 4} fill="rgb(120 113 108)" fontSize="9" fontFamily="monospace">{yMax}{last.label}</text>
        <text x={P} y={fy(yMin) + 11} fill="rgb(120 113 108)" fontSize="9" fontFamily="monospace">{yMin}{last.label}</text>
      </svg>
    </div>
  );
};

                      {isOpen ? <Icons.ChevUp size={16}/> : <Icons.ChevDown size={16}/>}
                    </div>
                  </button>
                  {isOpen && (
                    <div className="px-3 pb-3 pt-1 border-t border-stone-900">
                      <div className="py-3">
                        <ExerciseChart results={g.results}/>
                      </div>
                      <div className="space-y-1">
                        <div className="text-[10px] uppercase tracking-wider text-stone-500 font-bold mb-1.5">All sessions</div>
                        {g.results.map(r => (
                          <div key={r.id} className="flex items-center justify-between py-1.5 text-xs">
                            <span className="text-stone-400">{new Date(r.date).toLocaleDateString()}</span>
                            <button onClick={()=>onEdit(r)} aria-label={`Edit result ${r.blockName}`} className="font-digits font-bold text-stone-200 tabular-nums underline">{formatResult(r)} · Edit</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
};

// ---------- SYNC INDICATOR ----------
const SyncDot = ({ state }) => {
  if (state === 'disabled') return null;
  const cfg = {
    idle:    { color: 'bg-stone-500',   pulse: false, label: 'Offline mode' },
    syncing: { color: 'bg-amber-400',   pulse: true,  label: 'Syncing…' },
    synced:  { color: 'bg-emerald-500', pulse: false, label: 'Synced' },
    offline: { color: 'bg-rose-500',    pulse: true,  label: 'Cloud unreachable' },
  }[state] || { color: 'bg-stone-500', pulse: false, label: state };
  return (
    <div className="flex items-center gap-1.5 mr-1" title={cfg.label} aria-label={cfg.label}>
      <span className={`block w-2 h-2 rounded-full ${cfg.color} ${cfg.pulse ? 'animate-pulse' : ''}`}/>
    </div>
  );
};

// ---------- APP ----------
function ResultEditor({draft,onSave,onCancel,onDelete,canNext}) {
  const [value,setValue]=useState(()=>JSON.parse(JSON.stringify(draft.result.value||{})));
  const [time,setTime]=useState(fmt(draft.result.value?.timeSec||0));
  const [error,setError]=useState('');const panel=useRef(null);
  useEffect(()=>{
    const previous=document.activeElement;panel.current?.querySelector('input,button,textarea')?.focus();
    const trap=e=>{
      if(e.key==='Escape'){e.preventDefault();onCancel();}
      if(e.key==='Tab'){
        const items=[...panel.current.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(x=>!x.disabled);
        const first=items[0],last=items[items.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
      }
    };document.addEventListener('keydown',trap);return ()=>{document.removeEventListener('keydown',trap);previous?.focus();};
  },[]);
  const change=(key,text)=>setValue(v=>{const next={...v};if(text==='')delete next[key];else next[key]=Number(text);return next;});
  const save=next=>{
    try{
      const result={...draft.result,value:{...value,timeSec:TrainingCore.parseTime(time)}};
      for(const key of ['weightKg','reps','rounds','extraReps','setsCompleted','roundsCompleted','intervalsCompleted','calories'])if(result.value[key]!=null&&(!Number.isFinite(result.value[key])||result.value[key]<0))throw Error('Scores must be non-negative numbers.');
      if(result.value.rpe!=null&&(result.value.rpe<1||result.value.rpe>10))throw Error('RPE must be 1–10.');
      if(result.value.mode==='intervals')result.value.repsCompleted=result.value.intervalsCompleted??result.value.repsCompleted;
      for(const round of result.value.roundEntries||[])for(const field of ['weightKg','reps'])if(round[field]!=null&&(!Number.isFinite(round[field])||round[field]<0))throw Error('Each round must have valid non-negative scores.');
      onSave(result,next);
    }catch(e){setError(e.message);}
  };
  const fields=[['rounds','Full rounds'],['extraReps','Extra reps'],['setsCompleted','Sets completed'],['roundsCompleted','Rounds completed'],['intervalsCompleted','Intervals completed']].filter(([key])=>key in value);
  return <div className="result-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
    <section ref={panel} className="result-sheet" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title" className="text-lg font-bold mb-2">{draft.previousId?'Edit result':'Review & save result'}</h2>
      <p className="text-sm text-stone-300 mb-4">{draft.result.blockName}</p>
      {value.plannedWeightKg!=null&&<p className="text-xs text-amber-200 mb-3">Planned: {value.plannedWeightKg} kg. Enter the weight you actually used below.</p>}
      <div className="grid grid-cols-2 gap-3">
        <label className="text-xs text-stone-300">Time (mm:ss)<input className="w-full h-12 bg-stone-900 rounded-xl p-2 mt-1" value={time} onChange={e=>setTime(e.target.value)} inputMode="decimal"/></label>
        {fields.map(([key,label])=><label key={key} className="text-xs text-stone-300">{label}<input className="w-full h-12 bg-stone-900 rounded-xl p-2 mt-1" type="number" min="0" value={value[key]??''} onChange={e=>change(key,e.target.value)}/></label>)}
        {['weightKg','reps','calories','rpe'].map(key=><label key={key} className="text-xs text-stone-300">{{weightKg:'Actual load (kg)',reps:'Actual reps',calories:'Calories',rpe:'Effort (RPE 1–10)'}[key]}<input className="w-full h-12 bg-stone-900 rounded-xl p-2 mt-1" type="number" min={key==='rpe'?1:0} max={key==='rpe'?10:undefined} step={key==='weightKg'?'0.25':'1'} value={value[key]??''} onChange={e=>change(key,e.target.value)}/></label>)}
      </div>
      {value.roundEntries?.length>0&&<div className="mt-4"><h3 className="text-sm font-bold mb-2">Each round / set</h3>{value.roundEntries.map((entry,i)=><div key={i} className="grid grid-cols-3 gap-2 mb-2 items-end"><span className="text-xs">#{entry.round}</span>{['weightKg','reps'].map(key=><label key={key} className="text-xs">{key==='weightKg'?'Actual kg':'Reps'}<input className="w-full h-12 bg-stone-900 rounded-xl p-2" type="number" min="0" step={key==='weightKg'?'0.25':1} value={entry[key]??''} onChange={e=>setValue(v=>({...v,roundEntries:v.roundEntries.map((x,j)=>j===i?{...x,[key]:e.target.value===''?undefined:Number(e.target.value)}:x)}))}/></label>)}</div>)}</div>}
      <label htmlFor="result-notes" className="block text-xs text-stone-300 mt-4">Notes</label><textarea id="result-notes" aria-label="Notes" className="w-full rounded-xl p-3 bg-stone-900 mt-1" rows="3" value={value.notes||''} onChange={e=>setValue(v=>({...v,notes:e.target.value}))}/>
      <label className="flex gap-2 items-center text-sm mt-3"><input type="checkbox" checked={value.completed!==false} onChange={e=>setValue(v=>({...v,completed:e.target.checked}))}/>Workout completed (not partial)</label>
      {error&&<p role="alert" className="text-red-300 mt-3">{error}</p>}
      <div className="grid grid-cols-2 gap-2 mt-4"><button onClick={onCancel} className="h-12 bg-stone-800 rounded-xl">Cancel</button><button onClick={()=>save(false)} className="h-12 gradient-orange rounded-xl font-bold">Save result</button></div>
      {canNext&&<button onClick={()=>save(true)} className="w-full h-12 mt-2 bg-stone-800 rounded-xl">Save & next block</button>}
      {draft.previousId&&<button onClick={onDelete} className="w-full h-12 mt-2 text-red-300">Delete result</button>}
    </section>
  </div>;
}

function App() {
  const [authed, setAuthed] = useState(false);
  const [offlineSession,setOfflineSession]=useState(false);
  const [profile, setProfile] = useState(getActiveProfile);  // null until picked
  const [data, setDataRaw] = useState(() => profile ? loadData(profile) : seedData());
  const [tab, setTab] = useState('programming');
  const [timer, setTimer] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [storageError,setStorageError]=useState('');
  const [pendingCount,setPendingCount]=useState(0);
  const [resultDraft,setResultDraft]=useState(null);
  const generatorTimerRef=useRef(null);
  // Sync states: 'disabled' | 'idle' | 'syncing' | 'synced' | 'offline'
  const [sync, setSync] = useState(cloudEnabled() ? 'idle' : 'disabled');
  useEffect(()=>{
    if(!profile)return;
    if(new URLSearchParams(location.hash.slice(1)).has('setup')){setAuthed(false);return;}
    let cancelled=false;
    const verify=()=>authFetch('session',profile).then(()=>{
      if(cancelled)return;localStorage.setItem('vt_verified_session_v1_'+profile,String(Date.now()));setOfflineSession(false);setAuthed(true);
    }).catch(e=>{
      if(cancelled)return;
      const verified=Number(localStorage.getItem('vt_verified_session_v1_'+profile)||0);
      // This grants cached-device display only. Every cloud request still requires the HttpOnly server cookie.
      const cached=(e.status==null||e.status>=500)&&verified>0&&Date.now()-verified<30*86400000;
      if(!cached)localStorage.removeItem('vt_verified_session_v1_'+profile);
      setOfflineSession(cached);setAuthed(cached);
    });
    verify();window.addEventListener('online',verify);
    return()=>{cancelled=true;window.removeEventListener('online',verify);};
  },[profile]);
  useEffect(()=>{const expired=e=>{if(e.detail?.profile&&e.detail.profile!==profile)return;localStorage.removeItem('vt_verified_session_v1_'+profile);setAuthed(false);setOfflineSession(false);setStorageError('Session expired. Sign in to upload saved changes.');};window.addEventListener('vt-auth-expired',expired);return()=>window.removeEventListener('vt-auth-expired',expired);},[profile]);
  const haptic = useHaptic();
  const setData = (d) => {try{if(profile)saveData(profile,d);setDataRaw(d);setStorageError('');return true;}catch(e){setStorageError('Could not save on this device. Free storage or export a backup before continuing.');return false;}};
  const meta = profile ? profileMeta(profile) : null;
  // Build a cloud client bound to the active profile. useMemo so callers get a
  // stable reference within a single profile session.
  const cloud = useMemo(() => cloudFor(profile), [profile]);
  const outbox=useMemo(()=>{
    if(!profile || !authed || !cloudEnabled())return null;
    const addResultOnce=async result=>{try{await cloud.addResult(result);}catch(e){if(!/^API 409:/.test(e.message))throw e;const snapshot=await cloud.snapshot();const existing=(snapshot.results||[]).find(x=>x.id===result.id);if(!existing||JSON.stringify(existing.value)!==JSON.stringify(result.value))throw e;}};
    try{return TrainingCore.outbox(localStorage,'vt_outbox_v1_'+profile,async job=>{
      const p=job.payload;
      if(job.kind==='programme')await cloud.putProgramme(p.week,p.days);
      else if(job.kind==='clearWeek')await cloud.deleteProgramme(p.week);
      else if(job.kind==='result')await addResultOnce(p);
      else if(job.kind==='replaceResult'){await addResultOnce(p.result);await cloud.deleteResult(p.previousId);}
      else if(job.kind==='deleteResult')await cloud.deleteResult(p.id);
      else if(job.kind==='generator')await cloud.putGenerator(p);
      else throw Error('Unknown pending change; retained for recovery');
    },(state,n)=>{setSync(state);setPendingCount(n);});}catch(e){return null;}
  },[profile,cloud,authed]);
  useEffect(()=>{
    if(!outbox)return;
    const retry=()=>outbox.flush();window.addEventListener('online',retry);
    return ()=>{outbox.stop();window.removeEventListener('online',retry);clearTimeout(generatorTimerRef.current);};
  },[outbox]);
  const queueChange=(kind,payload)=>{
    if(!cloudEnabled())return true;
    if(!outbox){setStorageError('Pending changes could not be stored. Export a backup and retry.');setSync('offline');return false;}
    try{outbox.enqueue(kind,payload);return true;}catch(e){setStorageError('Saved locally, but could not store the upload queue. Export a backup before closing.');setSync('offline');return false;}
  };


  // When the user picks a new profile (initial pick or post-switch), load its bucket.
  const onPickProfile = (id) => {
    setAuthed(false);setProfile(id);
    setDataRaw(loadData(id));
    setSync(cloudEnabled() ? 'idle' : 'disabled');
  };
  // Logout / switch profile: end session AND clear profile → back to profile picker.
  // Picking a profile then requires the password again (LoginScreen).
  const onSwitchProfile = async () => {
    try{if(profile)await authFetch('logout',profile,{});}catch(e){setStorageError('Could not sign out of the server. Please retry online.');return;}
    localStorage.removeItem('vt_verified_session_v1_'+profile);setOfflineSession(false);
    endSession();
    clearActiveProfile();
    setAuthed(false);
    setProfile(null);
  };

  // Initial reconcile with server: pull snapshot, merge results, push local-only results up.
  // Re-runs when the active profile changes.
  useEffect(() => {
    if (!authed || !profile || !cloudEnabled()) return;
    let cancelled = false;
    (async () => {
      setSync('syncing');
      try {
        await outbox?.flush();
        const snap = await cloud.snapshot();
        if (cancelled) return;
        const local = loadData(profile);
        const jobs=outbox?.list()||[];
        const merged_data=TrainingCore.selectCurrentWeek(TrainingCore.reconcile(local,snap,jobs));
        saveData(profile,merged_data);setDataRaw(merged_data);
        const known=new Set((snap.results||[]).map(r=>r.id));
        const previouslyKnown=new Set(local._serverResultIds||[]);
        const queued=new Set(jobs.filter(j=>j.kind==='result'||j.kind==='replaceResult').map(j=>j.kind==='result'?j.payload.id:j.payload.result.id));
        for(const result of merged_data.results)if(!known.has(result.id)&&!previouslyKnown.has(result.id)&&!queued.has(result.id))queueChange('result',result);
        setPendingCount(outbox?.list().length||0);
        setSync(outbox?.list().length?'offline':'synced');
      } catch (e) {
        if (!cancelled) setSync('offline');
      }
    })();
    return () => { cancelled = true; };
  }, [authed, profile, outbox]);

  // cloudActions: imperative pushes triggered by view-level mutations.
  // Mutations are persisted in a profile-local outbox before sending; failed jobs remain retryable.
  const cloudActions={
    programmeUploaded:(week,days)=>queueChange('programme',{week,days}),
    programmeCleared:week=>queueChange('clearWeek',{week}),
    resultLogged:result=>queueChange('result',result),
    generatorChanged:g=>{clearTimeout(generatorTimerRef.current);generatorTimerRef.current=setTimeout(()=>queueChange('generator',g),1000);}
  };

  // Force a full resync from cloud (Settings button)
  const forceResync = async () => {
    if (!cloudEnabled()) { alert('Cloud sync is not configured'); return; }
    setSync('syncing');
    try {
      await outbox?.flush();
      const snap=await cloud.snapshot(),local=loadData(profile);
      if(setData(TrainingCore.selectCurrentWeek(TrainingCore.reconcile(local,snap,outbox?.list()||[])))===false)return;
      setSync(outbox?.list().length?'offline':'synced');
      alert(`Resynced ${meta.name} from cloud.`);
    } catch (e) {
      setSync('offline');
      alert('Resync failed: ' + e.message);
    }
  };

  // One-shot bulk push of localStorage to D1 (Settings button)
  const pushLocalToCloud = async () => {
    if (!cloudEnabled()) { alert('Cloud sync is not configured'); return; }
    if (!confirm(`Push ALL local programmes and results for ${meta.name} to the cloud? Existing cloud entries with the same week/result-id will be overwritten.`)) return;
    setSync('syncing');
    try {
      const local = loadData(profile);
      const r = await cloud.migrate({
        programme: local.programme || {},
        results: local.results || [],
        generator: local.generator || null,
      });
      setSync('synced');
      alert(`Pushed ${r.migrated.programmes} programmes and ${r.migrated.results} results.`);
    } catch (e) {
      setSync('offline');
      alert('Push failed: ' + e.message);
    }
  };

  if (!profile) return <ProfilePicker onPick={onPickProfile}/>;
  if (!authed) return <LoginScreen profile={profile} onSuccess={()=>{setActiveProfile(profile);localStorage.setItem('vt_verified_session_v1_'+profile,String(Date.now()));setOfflineSession(false);setAuthed(true);}}/>;

  const openTimer = (block, dayIdx, week) => {
    haptic(15);
    const t = blockToTimer(block);
    const wodText = [ ...(block.movements || []), ...(block.notes ? [block.notes] : []) ].join('\n');
    setTimer({ exerciseId:TrainingCore.exerciseKey({exerciseId:block.exerciseId,blockName:block.name,value:{mode:t.mode}}), mode: t.mode, config: { ...t.config, workoutName: block.name, workoutText: wodText }, blockId: block.id, blockName: block.name, dayIdx, week });
  };
  const logResult=(value,closeAfter=true)=>{
    if(!timer)return;
    const proposed={...value,exerciseId:timer.exerciseId};
    if(proposed.weightKg!=null){proposed.plannedWeightKg=proposed.weightKg;delete proposed.weightKg;}
    setResultDraft({result:{id:'r_'+TrainingCore.uuid(),blockId:timer.blockId,blockName:timer.blockName,exerciseId:timer.exerciseId,week:timer.week,dayIdx:timer.dayIdx,date:new Date().toISOString(),value:proposed},closeAfter});
  };
  const saveResult=(result,nextBlock=false)=>{
    const draft=resultDraft;
    const results=[result,...data.results.filter(r=>r.id!==draft.previousId)];
    if(setData({...data,results})===false)return;
    if(draft.previousId)queueChange('replaceResult',{previousId:draft.previousId,result});else cloudActions.resultLogged(result);
    setResultDraft(null);
    if(nextBlock && timer){const blocks=data.programme[timer.week]?.[timer.dayIdx]?.blocks||[];const next=blocks[blocks.findIndex(b=>b.id===timer.blockId)+1];if(next){openTimer(next,timer.dayIdx,timer.week);return;}}
    if(draft.closeAfter)setTimer(null);
  };
  const editResult=result=>setResultDraft({previousId:result.id,result:{...result,id:'r_'+TrainingCore.uuid(),updatedAt:new Date().toISOString()},closeAfter:false});
  const deleteResult=()=>{
    const id=resultDraft?.previousId;if(!id||!confirm('Delete this result?'))return;
    if(setData({...data,results:data.results.filter(r=>r.id!==id)})===false)return;
    queueChange('deleteResult',{id});setResultDraft(null);
  };
  const logout = () => onSwitchProfile();

  const tabs = [
    { id: 'programming', label: 'Today', icon: <Icons.Calendar size={18}/> },
    { id: 'progress', label: 'Progress', icon: <Icons.Bar size={18}/> },
    { id: 'import', label: 'Import', icon: <Icons.Upload size={18}/> },
  ];

  return (
    <div className="min-h-screen bg-stone-950 flex flex-col">
      {/* Compact header — no sticky on mobile to save space */}
      <header className="flex items-center justify-between px-4 pt-3 pb-3 border-b border-stone-900 pt-safe">
        <div className="flex items-center gap-2 min-w-0">
          <span className="gradient-text font-extrabold text-xl tracking-tight truncate">Vad Training</span>
          <span className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-[0.18em] text-white bg-gradient-to-br ${meta.gradient} shrink-0`}>{meta.name}</span>
        </div>
        <div className="flex items-center gap-1">
          <a href="/chrono" className="p-2.5 rounded-full text-stone-400 tap-scale flex items-center justify-center" title="Open Chrono Timer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </a>
          <SyncDot state={sync}/>
          <button aria-label="Settings" onClick={()=>setSettingsOpen(true)} className="p-2.5 rounded-full text-stone-400 tap-scale"><Icons.Settings size={20}/></button>
          <button aria-label="Sign out" onClick={logout} className="p-2.5 rounded-full text-stone-400 tap-scale"><Icons.LogOut size={20}/></button>
        </div>
      </header>
      <div className="px-4 text-xs text-stone-300" role="status" aria-live="polite">
        {offlineSession&&<p className="text-amber-200 py-2">Offline cached view · connect to verify your cloud session.</p>}
        {storageError && <p className="p-3 border border-red-700 rounded-xl text-red-300" role="alert">{storageError}</p>}
        {cloudEnabled() && <button className="min-h-[44px] text-left underline" onClick={()=>outbox?.flush()}>{pendingCount?`${pendingCount} change(s) saved locally · tap to retry upload`:sync==='synced'?'All changes uploaded':sync==='syncing'?'Checking cloud…':'Cloud unavailable · working locally'}</button>}
      </div>
      {/* Main content with bottom padding for nav */}
      <main className="flex-1 px-4 pt-4 pb-24">
        {tab === 'programming' && <ProgrammingView data={data} setData={setData} openTimer={openTimer} cloudActions={cloudActions}/>}
        {tab === 'progress' && <ProgressView data={data} onEdit={editResult}/>}
        {tab === 'import' && <ImportView data={data} setData={setData} cloudActions={cloudActions} onViewWeek={()=>setTab('programming')}/>}
      </main>
      {/* Bottom tab bar — iOS native style, fixed to bottom */}
      <nav className="fixed bottom-0 inset-x-0 z-30 bg-stone-950/95 backdrop-blur-xl border-t border-stone-900 pb-safe">
        <div className="grid grid-cols-3 gap-1 p-2 max-w-md mx-auto">
          {tabs.map(t => {
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={()=>{setTab(t.id); haptic(8);}}
                className="flex flex-col items-center justify-center py-2 rounded-xl tap-scale">
                <div className={active ? 'text-orange-500' : 'text-stone-500'}>{t.icon}</div>
                <span className={`text-[10px] mt-1 font-bold uppercase tracking-wider ${active ? 'text-stone-100' : 'text-stone-500'}`}>{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
      {timer && <ChronoTimer key={timer.blockId} initialMode={timer.mode} initialConfig={timer.config} onClose={()=>setTimer(null)} onLog={logResult}/>}
      {resultDraft && <ResultEditor draft={resultDraft} onSave={saveResult} onCancel={()=>setResultDraft(null)} onDelete={deleteResult} canNext={!!timer&&!resultDraft.previousId&&(data.programme[timer.week]?.[timer.dayIdx]?.blocks||[]).some((b,i,a)=>b.id===timer.blockId&&i<a.length-1)}/>} 
      {settingsOpen && <SettingsModal onClose={()=>setSettingsOpen(false)} sync={sync} forceResync={forceResync} pushLocalToCloud={pushLocalToCloud} profile={profile} onSwitchProfile={onSwitchProfile}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
