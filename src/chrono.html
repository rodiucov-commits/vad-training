<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chrono">
<meta name="mobile-web-app-capable" content="yes">
<title>Chrono — Workout Timer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    background: #0c0a09;
    color: #f5f5f4;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  .font-digits {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.05em;
  }
  .grain::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 28px 28px;
    pointer-events: none;
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { scrollbar-width: none; }
  .pt-safe { padding-top: calc(var(--safe-top) + 1.25rem) !important; }
  .pb-safe { padding-bottom: calc(var(--safe-bottom) + 0.5rem) !important; }
  /* Only the middle pane scrolls: workout actions always have their own space. */
  .chrono-shell {
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    overflow: hidden;
  }
  .chrono-shell > header, .chrono-modes, .chrono-controls { flex-shrink: 0; }
  .chrono-main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .chrono-settings, .chrono-progress { flex-shrink: 0; }
  .chrono-settings-toggle { min-height: 44px; }
  .chrono-stage {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 20px;
    gap: 12px;
  }
  .chrono-stage > :not(.chrono-ring-slot) { flex-shrink: 0; }
  .chrono-ring-slot {
    position: relative;
    flex: 1 0 144px;
    min-height: 144px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
  }
  .chrono-ring { width: min(65vw, 30vh, 320px); aspect-ratio: 1; flex-shrink: 0; }
  @supports (width: 1cqh) {
    .chrono-ring { width: min(100cqw, 100cqh, 320px); }
  }
  .chrono-context { text-align: center; overflow-wrap: anywhere; }
  .chrono-controls { position: relative; z-index: 1; padding: 12px 20px; }
  .chrono-controls button { min-height: 48px; }
  .chrono-rounds button { min-width: 44px; min-height: 44px; }
  @media (max-height: 700px) {
    .chrono-shell > header { padding-top: calc(var(--safe-top) + 0.5rem) !important; padding-bottom: 0.5rem; }
    .chrono-modes { padding-top: 8px; padding-bottom: 8px; }
    .chrono-stage { padding-top: 8px; padding-bottom: 8px; gap: 8px; }
    .chrono-controls { padding-top: 8px; }
    .chrono-summary { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="/timer-engine.js?v=20261015-logic1"></script>

<script type="text/babel" data-presets="react" data-runtime="classic">
const { useState, useEffect, useRef } = React;

// ---- Inline SVG icons ----
const I = ({ children, size = 18 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const Play = ({size}) => <I size={size}><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></I>;
const Pause = ({size}) => <I size={size}><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></I>;
const Reset = ({size}) => <I size={size}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></I>;
const Plus = ({size}) => <I size={size}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></I>;
const Minus = ({size}) => <I size={size}><line x1="5" y1="12" x2="19" y2="12"/></I>;
const Check = ({size}) => <I size={size}><polyline points="20 6 9 17 4 12"/></I>;
const Skip = ({size}) => <I size={size}><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></I>;
const VolOn = ({size}) => <I size={size}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></I>;
const VolOff = ({size}) => <I size={size}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></I>;

const PRESTART_SEC = 10;

const MODES = [
  { id: 'rest',       label: 'REST' },
  { id: 'amrap',      label: 'AMRAP' },
  { id: 'fortime',    label: 'FOR TIME' },
  { id: 'emom',       label: 'EMOM' },
  { id: 'emomblocks', label: 'EMOM BLOCKS' },
  { id: 'intervals',  label: 'INTERVALS' },
  { id: 'hold',       label: 'HOLD' },
  { id: 'stopwatch',  label: 'STOPWATCH' },
];

const fmt = (sec) => {
  const s = Math.max(0, sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = Math.floor(s % 60);
  if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
};

function useAudio(muted) {
  const ctxRef = useRef(null);
  const ensureCtx = () => {
    if (!ctxRef.current) {
      try { ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); }
      catch { return null; }
    }
    if (ctxRef.current?.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  };
  const beep = (freq, dur, vol = 0.3) => {
    if (muted) return;
    const ctx = ensureCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
    osc.start();
    osc.stop(ctx.currentTime + dur / 1000);
  };
  return {
    tick:       () => beep(820, 70, 0.18),
    tickWarn:   () => beep(880, 110, 0.28),
    go:         () => beep(1100, 260, 0.38),
    rest:       () => beep(480, 220, 0.28),
    sideSwitch: () => beep(950, 140, 0.28),
    done:       () => { beep(820, 130, 0.3); setTimeout(() => beep(1050, 130, 0.3), 160); setTimeout(() => beep(1350, 280, 0.34), 320); },
    unlock:     () => beep(600, 10, 0.001),
  };
}

function useWakeLock(active) {
  useEffect(() => {
    let lock = null;
    if (active && 'wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {});
    }
    return () => { if (lock) lock.release().catch(() => {}); };
  }, [active]);
}

const Stepper = ({ label, value, onChange, min = 0, max = 999, step = 1, suffix }) => (
  <div className="flex flex-col gap-1">
    <div className="text-[10px] uppercase tracking-[0.18em] text-stone-500">{label}</div>
    <div className="flex items-center bg-stone-900 rounded-lg border border-stone-800">
      <button onClick={() => onChange(Math.max(min, value - step))}
        className="p-2 text-stone-400 hover:text-stone-100 transition active:scale-95"><Minus size={14}/></button>
      <div className="flex-1 text-center font-digits tabular-nums text-stone-100 text-sm">
        {value}{suffix && <span className="text-stone-500 text-xs ml-0.5">{suffix}</span>}
      </div>
      <button onClick={() => onChange(Math.min(max, value + step))}
        className="p-2 text-stone-400 hover:text-stone-100 transition active:scale-95"><Plus size={14}/></button>
    </div>
  </div>
);

function Chrono() {
  const [mode, setMode] = useState('rest');
  const [muted, setMuted] = useState(false);
  const audio = useAudio(muted);

  const [restSec, setRestSec]               = useState(150);
  const [restSets, setRestSets]             = useState(4);
  const [amrapMin, setAmrapMin]             = useState(20);
  const [forTimeCapMin, setForTimeCapMin]   = useState(15);
  const [emomRounds, setEmomRounds]         = useState(12);
  const [intWork, setIntWork]               = useState(180);
  const [intRest, setIntRest]               = useState(90);
  const [intRounds, setIntRounds]           = useState(6);
  const [holdSec, setHoldSec]               = useState(20);
  const [holdSides, setHoldSides]           = useState(2);
  const [holdRounds, setHoldRounds]         = useState(3);
  // EMOM Blocks config
  const [blockWorkMin, setBlockWorkMin]     = useState(12);
  const [blockRestMin, setBlockRestMin]     = useState(4);
  const [blockCount, setBlockCount]         = useState(3);
  const [extraReps, setExtraReps] = useState(0);
  const [includeFinalRest, setIncludeFinalRest] = useState(false);
  const lastSegmentRef = useRef(-1);
  const [phase, setPhase] = useState('idle'); // idle | prestart | running | paused | done
  const [settingsOpen, setSettingsOpen] = useState(true);
  useEffect(() => {
    if (phase === 'running' || phase === 'prestart') setSettingsOpen(false);
    if (phase === 'idle') setSettingsOpen(true);
  }, [phase, mode]);
  const [elapsed, setElapsed] = useState(0);
  const [setIdx, setSetIdx] = useState(1);
  const [rounds, setRounds] = useState(0);
  const [intervalIdx, setIntervalIdx] = useState(1);
  const [isWork, setIsWork] = useState(true);
  const [sideIdx, setSideIdx] = useState(1);
  const [holdRoundIdx, setHoldRoundIdx] = useState(1);
  // EMOM Blocks state
  const [blockIdx, setBlockIdx] = useState(1);
  const [blockPhase, setBlockPhase] = useState('work'); // 'work' | 'rest'

  const startRef = useRef(null);
  const pausedElapsedRef = useRef(0);
  const lastBeepSec = useRef(-1);

  useWakeLock(phase === 'running' || phase === 'prestart');

  useEffect(() => { fullReset(); }, [mode]);

  function fullReset() {
    setExtraReps(0); lastSegmentRef.current = -1;
    setPhase('idle'); setElapsed(0); setSetIdx(1); setRounds(0);
    setIntervalIdx(1); setIsWork(true); setSideIdx(1); setHoldRoundIdx(1);
    setBlockIdx(1); setBlockPhase('work');
    startRef.current = null; pausedElapsedRef.current = 0; lastBeepSec.current = -1;
  }
  useEffect(() => {
    if (phase !== 'running' && phase !== 'prestart') return;
    if (!startRef.current) startRef.current = Date.now() - pausedElapsedRef.current * 1000;
    const id = setInterval(() => { setElapsed((Date.now() - startRef.current) / 1000); }, 80);
    return () => clearInterval(id);
  }, [phase]);

  const plan = WorkoutClock.build(mode==='rest' ? 'countdown' : mode, {amrapMin,capMin:forTimeCapMin,emomRounds,blockWorkMin,blockRestMin,blockCount,
    intWork,intRest,intRounds,includeFinalRest,holdSec,holdSides,holdRounds,countdownSec:restSec});
  const clock = WorkoutClock.at(plan, elapsed);
  useEffect(() => {
    if (phase === 'prestart') {
      const rem=PRESTART_SEC-elapsed;
      if (rem<=3 && rem>0 && lastBeepSec.current!==Math.ceil(rem)) { lastBeepSec.current=Math.ceil(rem); audio.tickWarn(); }
      if (rem<=0) {
        audio.go(); startRef.current=Date.now(); pausedElapsedRef.current=0;
        lastBeepSec.current=-1; lastSegmentRef.current=-1; setElapsed(0); setPhase('running');
      }
      return;
    }
    if (phase!=='running') return;
    if (!plan.segments.length) return;
    if (clock.done) { setElapsed(plan.totalSec); setPhase('done'); audio.done(); return; }
    if (lastSegmentRef.current!==clock.index) {
      if (lastSegmentRef.current!==-1) { clock.segment.phase==='rest' ? audio.rest() : audio.go(); }
      lastSegmentRef.current=clock.index; lastBeepSec.current=-1;
    }
    if (clock.remaining<=3 && clock.remaining>0 && lastBeepSec.current!==Math.ceil(clock.remaining)) {
      lastBeepSec.current=Math.ceil(clock.remaining); audio.tick();
    }
  }, [elapsed, phase, mode]);

  function start() {
    audio.unlock();
    if (phase === 'idle' || phase === 'done') {
      if (phase === 'done') fullReset();
      startRef.current = Date.now();
      pausedElapsedRef.current = 0;
      lastBeepSec.current = -1;
      setElapsed(0);
      setPhase('prestart');
    } else if (phase === 'paused') {
      setPhase('running');
    }
  }

  function skipPrestart() {
    if (phase !== 'prestart') return;
    audio.go();
    startRef.current = Date.now();
    pausedElapsedRef.current = 0;
    lastBeepSec.current = -1;
    setElapsed(0);
    setPhase('running');
  }

  function pause() {
    if (phase === 'running') {
      pausedElapsedRef.current = elapsed;
      startRef.current = null;
      setPhase('paused');
    }
  }
  function nextSet() {
    if (setIdx>=restSets) { fullReset(); return; }
    setSetIdx(i=>i+1); startRef.current=Date.now(); pausedElapsedRef.current=0;
    lastBeepSec.current=-1; lastSegmentRef.current=-1; setElapsed(0); setPhase('prestart');
  }

  const view=WorkoutClock.describe(plan,elapsed);
  let big=fmt(view.big), phaseLbl=view.label, context=view.context;
  let accent=clock.segment?.phase==='rest' ? 'text-sky-400' : 'text-lime-400';
  if (mode==='stopwatch') { big=fmt(elapsed); phaseLbl='RUNNING'; context=''; }
  if (mode==='rest') context=`REST · SET ${setIdx}/${restSets}`;
  if (mode==='amrap') context=`ROUNDS ${rounds} + ${extraReps} REPS`;
  if (phase==='idle') { phaseLbl='READY'; accent='text-stone-100'; }
  if (phase==='paused') phaseLbl='PAUSED';
  if (phase==='done') { phaseLbl='DONE'; accent='text-lime-400'; }
  if (phase==='prestart') {
    big=String(Math.ceil(Math.max(0,PRESTART_SEC-elapsed))).padStart(2,'0');
    phaseLbl='GET READY'; context='STARTING IN...'; accent='text-amber-400';
  }

  const renderConfig = () => {
    if (phase === 'running' || phase === 'prestart') return null;
    const wrap = "grid grid-cols-3 gap-2 px-5 py-4";
    if (mode === 'rest') return (<div className={wrap}>
      <Stepper label="Rest" value={restSec} onChange={setRestSec} min={5} step={5} suffix="s"/>
      <Stepper label="Sets" value={restSets} onChange={setRestSets} min={1} max={20}/>
      <Stepper label="Set #" value={setIdx} onChange={setSetIdx} min={1} max={restSets}/>
    </div>);
    if (mode === 'amrap') return (<div className={wrap}>
      <Stepper label="Minutes" value={amrapMin} onChange={setAmrapMin} min={1} max={60} suffix="m"/>
    </div>);
    if (mode === 'fortime') return (<div className={wrap}>
      <Stepper label="Cap" value={forTimeCapMin} onChange={setForTimeCapMin} min={1} max={60} suffix="m"/>
    </div>);
    if (mode === 'emom') return (<div className={wrap}>
      <Stepper label="Rounds" value={emomRounds} onChange={setEmomRounds} min={1} max={60}/>
    </div>);
    if (mode === 'emomblocks') return (<div className={wrap}>
      <Stepper label="Work" value={blockWorkMin} onChange={setBlockWorkMin} min={1} max={60} suffix="m"/>
      <Stepper label="Rest" value={blockRestMin} onChange={setBlockRestMin} min={1} max={30} suffix="m"/>
      <Stepper label="Blocks" value={blockCount} onChange={setBlockCount} min={1} max={10}/>
    </div>);
    if (mode === 'intervals') return (<div className={wrap}>
      <Stepper label="Work" value={intWork} onChange={setIntWork} min={5} step={5} suffix="s"/>
      <Stepper label="Rest" value={intRest} onChange={setIntRest} min={5} step={5} suffix="s"/>
      <Stepper label="Rounds" value={intRounds} onChange={setIntRounds} min={1} max={30}/>
    </div>);
    if (mode === 'hold') return (<div className={wrap}>
      <Stepper label="Duration" value={holdSec} onChange={setHoldSec} min={5} step={5} suffix="s"/>
      <Stepper label="Sides" value={holdSides} onChange={setHoldSides} min={1} max={2}/>
      <Stepper label="Rounds" value={holdRounds} onChange={setHoldRounds} min={1} max={10}/>
    </div>);
    return null;
  };

  const onRoundTap = () => {
    if (phase === 'running' && mode === 'amrap') { setRounds(r => r + 1); audio.tick(); }
  };

  const progressPct = () => phase==='prestart' ? Math.min(100,elapsed/PRESTART_SEC*100) : clock.progress*100;
  const ringFrac = () => {
    if (phase==='idle') return 0;
    if (mode==='stopwatch' ) return (elapsed%60)/60;
    return clock.progress;
  };
  const RING_C = 2 * Math.PI * 150;
  const config = renderConfig();

  return (
    <div className="bg-stone-950">
      <div className="chrono-shell relative max-w-md mx-auto flex flex-col grain">
        <header className="flex items-center justify-between px-5 pt-5 pb-4 border-b border-stone-900 pt-safe">
          <div className="flex items-center gap-1.5">
            <a href="/" className="p-2 -ml-2 rounded-full text-stone-400 hover:text-stone-100 hover:bg-stone-900 transition" title="Back to programme">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
              </svg>
            </a>
            <div className="flex items-baseline gap-2.5">
              <span className="font-digits font-extrabold text-lg tracking-tight">CHRONO</span>
              <span className="text-stone-600 text-[10px] uppercase tracking-[0.25em]">v0.3 · rodiucov</span>
            </div>
          </div>
          <button onClick={() => setMuted(m => !m)}
                  className="p-2 rounded-full hover:bg-stone-900 transition text-stone-400 hover:text-stone-100">
            {muted ? <VolOff size={18}/> : <VolOn size={18}/>}
          </button>
        </header>

        <div className="chrono-modes flex overflow-x-auto gap-1.5 px-4 py-3 border-b border-stone-900 scrollbar-hide">
          {MODES.map(m => (
            <button key={m.id} onClick={() => setMode(m.id)}
              className={`px-3.5 py-1.5 rounded-full text-[11px] font-semibold uppercase tracking-[0.14em] whitespace-nowrap transition border ${
                mode === m.id ? 'bg-stone-100 text-stone-950 border-stone-100'
                              : 'border-stone-800 text-stone-500 hover:text-stone-200 hover:border-stone-700'
              }`}>{m.label}</button>
          ))}
        </div>

        <main className="chrono-main">
        {config && (
          <section className="chrono-settings border-b border-stone-900">
            <button type="button" onClick={() => setSettingsOpen(open => !open)}
                    aria-expanded={settingsOpen} aria-controls="timer-settings"
                    className="chrono-settings-toggle w-full px-5 text-left text-xs uppercase tracking-widest text-stone-400">
              Settings · {settingsOpen ? 'Hide −' : 'Show +'}
            </button>
            <div id="timer-settings" hidden={!settingsOpen}>{config}
              {mode==='intervals' && <button type="button" aria-pressed={includeFinalRest} onClick={()=>setIncludeFinalRest(v=>!v)}
                className="w-full min-h-[44px] px-4 pb-3 text-xs text-stone-400">Final rest: {includeFinalRest?'Included':'Off — between rounds only'}</button>}
            </div>
          </section>
        )}

        <div className="chrono-progress h-px bg-stone-900 relative overflow-hidden">
          <div className={`absolute inset-y-0 left-0 ${phase === 'prestart' ? 'bg-amber-500' : 'bg-red-600'} transition-all duration-75`}
               style={{ width: `${progressPct()}%` }}/>
        </div>

        <div onClick={onRoundTap}
             className={`chrono-stage ${mode === 'amrap' && phase === 'running' ? 'cursor-pointer active:bg-stone-900/50' : ''} transition`}>
          <div>
            <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-[0.25em] border ${
              phase === 'prestart' ? 'border-amber-600 text-amber-400 bg-amber-950/30 animate-pulse' :
              phase === 'done' ? 'border-red-600 text-red-500 bg-red-950/30' :
              phase === 'running' ? 'border-stone-700 text-stone-300 bg-stone-900/50' :
              'border-stone-800 text-stone-500'
            }`}>● {phaseLbl}</span>
          </div>

          <div className="chrono-ring-slot">
          <div className="chrono-ring relative flex items-center justify-center">
            <svg viewBox="0 0 320 320" className="absolute inset-0 w-full h-full" style={{transform:'rotate(-90deg)'}}>
              <circle cx="160" cy="160" r="150" fill="none" stroke="#292524" strokeWidth="7"/>
              <circle cx="160" cy="160" r="150" fill="none" stroke="url(#ringGrad)" strokeWidth="7" strokeLinecap="round"
                strokeDasharray={RING_C} strokeDashoffset={RING_C * (1 - ringFrac())}
                style={{transition:'stroke-dashoffset 0.12s linear'}}/>
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#f97316"/><stop offset="100%" stopColor="#ef4444"/>
                </linearGradient>
              </defs>
            </svg>
            <div className={`font-digits font-extrabold text-5xl sm:text-6xl leading-none ${accent} transition-colors`}>
              {big}
            </div>
          </div>
          </div>

          {mode === 'amrap' && phase !== 'prestart' && (
            <div className="chrono-rounds flex flex-col items-center gap-2">
              <div className="text-[10px] uppercase tracking-[0.25em] text-stone-500">Rounds · tap screen</div>
              <div className="flex items-center gap-4">
                <button onClick={(e) => { e.stopPropagation(); setRounds(r => Math.max(0, r - 1)); }}
                  className="p-2 rounded-full bg-stone-900 border border-stone-800 text-stone-400 active:scale-95"><Minus size={16}/></button>
                <div className="font-digits font-bold text-5xl tabular-nums w-24 text-center">{rounds}</div>
                <button onClick={(e) => { e.stopPropagation(); setRounds(r => r + 1); audio.tick(); }}
                  className="p-2 rounded-full bg-stone-900 border border-stone-800 text-stone-400 active:scale-95"><Plus size={16}/></button>
              </div>
            </div>
          )}

          {mode==='amrap' && phase!=='prestart' && (
            <div className="flex items-center gap-3 text-xs text-stone-400" onClick={e=>e.stopPropagation()}>
              <label htmlFor="amrap-extra-reps">Extra reps</label>
              <input id="amrap-extra-reps" aria-label="AMRAP extra reps" type="number" min="0" value={extraReps}
                onChange={e=>setExtraReps(Math.max(0,Math.floor(Number(e.target.value)||0)))}
                className="w-20 h-12 text-center rounded-xl bg-stone-900 border border-stone-700 font-digits"/>
            </div>
          )}

          {context && (mode !== 'amrap' || phase === 'prestart') && (
            <div className={`chrono-context text-xs uppercase tracking-[0.28em] font-semibold ${phase === 'prestart' ? 'text-amber-500/70' : 'text-stone-500'}`}>{context}</div>
          )}
        </div>
        </main>

        <div className="chrono-controls border-t border-stone-900 bg-stone-950 pb-safe" role="group" aria-label="Timer controls">
          <div className="flex items-stretch gap-2">
            {phase === 'prestart' ? (
              <button onClick={skipPrestart}
                className="flex-1 bg-amber-500 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm py-4 rounded-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
                <Skip size={18}/> Skip · {Math.ceil(Math.max(0, PRESTART_SEC - elapsed))}
              </button>
            ) : phase === 'running' ? (
              <button onClick={pause}
                className="flex-1 bg-stone-100 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm py-4 rounded-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
                <Pause size={18}/> Pause
              </button>
            ) : phase === 'done' && mode === 'rest' && setIdx < restSets ? (
              <button onClick={nextSet}
                className="flex-1 bg-red-600 text-white font-bold uppercase tracking-[0.2em] text-sm py-4 rounded-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
                <Skip size={18}/> Next set ({setIdx + 1}/{restSets})
              </button>
            ) : (
              <button onClick={start}
                className="flex-1 bg-red-600 text-white font-bold uppercase tracking-[0.2em] text-sm py-4 rounded-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
                <Play size={18}/>
                {phase === 'paused' ? 'Resume' : phase === 'done' ? 'Again' : 'Start'}
              </button>
            )}
            <button onClick={fullReset}
              aria-label="Reset timer"
              className="px-5 bg-stone-900 border border-stone-800 text-stone-400 rounded-xl hover:text-stone-100 active:scale-[0.98] transition">
              <Reset size={18}/>
            </button>
          </div>

          {mode === 'fortime' && phase === 'running' && (
            <button onClick={() => { audio.done(); setPhase('done'); }}
              className="mt-2 w-full bg-lime-500 text-stone-950 font-bold uppercase tracking-[0.2em] text-sm py-3 rounded-xl active:scale-[0.98] transition flex items-center justify-center gap-2">
              <Check size={18}/> Finish
            </button>
          )}

          <div className="chrono-summary mt-3 text-center text-[10px] uppercase tracking-[0.25em] text-stone-600">
            {mode === 'rest'       && `REST · ${restSec}s × ${restSets} sets · ${PRESTART_SEC}s lead-in`}
            {mode === 'amrap'      && `AMRAP · ${amrapMin} min · ${PRESTART_SEC}s lead-in`}
            {mode === 'fortime'    && `FOR TIME · cap ${forTimeCapMin} min · ${PRESTART_SEC}s lead-in`}
            {mode === 'emom'       && `EMOM · ${emomRounds} min · ${PRESTART_SEC}s lead-in`}
            {mode === 'emomblocks' && `EMOM BLOCKS · ${blockWorkMin}m work / ${blockRestMin}m rest × ${blockCount} blocks · ${PRESTART_SEC}s lead-in`}
            {mode === 'intervals'  && `${intRounds} × (${intWork}s / ${intRest}s) · ${PRESTART_SEC}s lead-in`}
            {mode === 'hold'       && `${holdSec}s × ${holdSides} side${holdSides > 1 ? 's' : ''} × ${holdRounds} rounds · ${PRESTART_SEC}s lead-in`}
            {mode === 'stopwatch'  && `STOPWATCH · ${PRESTART_SEC}s lead-in`}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Chrono/>);
</script>
</body>
</html>
