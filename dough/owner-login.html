<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Owner sign-in · Dough & Co.</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/owner-login.css?v=owner-password-1"></head>
<body><main><a class="brand" href="/">d. <span>Dough & Co.</span></a><p class="eyebrow">Your recipe notebook</p><h1 id="title">Owner sign-in</h1><p id="intro">Sign in to use your calculators and personal notes.</p>
<form id="auth-form"><label>Email<input id="email" name="username" type="email" autocomplete="username" required value="rodiucov@gmail.com"></label>
<label id="old-password-row" hidden>Current password<input id="old-password" name="oldPassword" type="password" autocomplete="current-password" maxlength="256"></label>
<label><span id="password-label">Password</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
<label id="confirm-row" hidden>Confirm new password<input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="256"></label>
<p id="password-help" hidden>Use at least 12 characters. A few memorable words work well.</p><button type="submit" id="submit">Sign in</button><p id="status" role="status" aria-live="polite"></p></form>
<p id="recovery">Forgot your password? Ask Uni for a new private reset link.</p><p><a href="/">Back to the recipes</a></p><noscript>Enable JavaScript to sign in.</noscript></main><script type="module" src="/owner-login.js?v=owner-password-1"></script></body></html>
